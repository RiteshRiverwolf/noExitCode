# The pitch demo: one mission, several agents, every beat a real run.
#
# This file is the ONE place a scenario is fixed -- the user allowed hard-coding
# the demo scenario and nothing else. The Planner plans `request`
# (workbench/planner.py); this file supplies only what a plan cannot know, the
# beats no plan would contain, and the beats run when no plan could be made.
# What each beat does is ordinary workbench code (workbench/missions.py).

title: "R-2247 reactor: scanned inspection report to draft approval note"
request: >-
  Read the scanned inspection report for reactor R-2247 and draft the approval note.
  Find the procedure section on which findings or readings trigger escalation of an
  inspection report. Then tell me when the next inspection is due.

# Shown with the plan. {plan}: what the Planner said. {reason}: why it did not plan.
plan_notes:
  planned: >-
    {plan} Steps marked "from the demo scenario" are staged in workbench/demo.yaml, not planned.
  scenario: >-
    {reason} The steps below are the demo scenario, written in workbench/demo.yaml --
    not a plan the system made.

# Shown in "Why this model": the Router's choice and reasons for each task this mission touches.
router_tasks: [plan, write_summary, embed, answer_from_library, code, second_read]

# Settings for the Planner's steps, by kind of step: which scan of the report, and
# the wrong value injected on purpose. A caption is shown after the Planner's reason.
step_settings:
  inspection:
    source: scan
    scan_quality: medium
    by_doc_id:
      insp_1002:
        inject_fault: render
        caption: >-
          A wrong number is injected into the note on purpose, so the QA Checker can
          catch it and send the note back.
  library: {k: 3}

# The scenario's own plan, run when the Planner does not plan (no qualified model,
# failed checks). A beat marked `staged` also runs in a planned demo -- work no plan
# would contain -- after the last planned step of the kind named in `after`.
beats:
  - id: inspect
    kind: inspection
    title: Read the scanned report and draft the note
    caption: >-
      The scan is read by OCR and every value keeps its cell. Rules decide in code,
      a model writes only the summary, and a wrong number is injected on purpose so
      the QA Checker can catch it and send the note back.
    agents: [Document Reader, Evidence Builder, Rules Engine, Router, Report Writer, QA Checker]
    doc_id: insp_1002
    source: scan
    scan_quality: medium
    inject_fault: render

  - id: library
    kind: library
    title: Find the procedure behind the escalation
    caption: >-
      The library search returns the procedure section and page. Every passage is
      cited, and a section it refers to is pulled in with it.
    agents: [Librarian (search)]
    question: When must an inspection report be escalated for engineering review?
    k: 3

  - id: damaged
    kind: inspection
    staged: true
    after: library
    title: The same report with a damaged digit
    caption: >-
      The last digit of CML-03 is blurred. The column prints two decimals and this
      cell reads one, so the run pauses for a person instead of guessing. In Review,
      an engineer enters the value from the original report and the run resumes
      from exactly that step.
    agents: [Document Reader, Evidence Builder, Engineer (Review tab)]
    doc_id: insp_1002_damaged
    image: [bench/stage1/partial/insp_1002_p1_blurred.png]
    pause_for_review: true

  - id: code
    kind: code
    title: When is the next inspection due?
    caption: >-
      No document says, so the Coder writes a program and runs it in the sealed
      sandbox against tests it never sees. When it fails, it reads the failure and
      fixes it.
    agents: [Router, Coder, Sandbox]
    task_id: next_due_date
