# The agent team, as data (docs/WHOLE_PICTURE.md §3, §10a).
#
# Each agent: what it is for, the ONLY tools it may call, the Router task that
# picks its model, its budgets, its instructions and the shape of its output.
# Code enforces the tool list and validates the output; nothing here is trusted
# because a model was asked nicely.
#
# This file is procedural memory (§7d): no agent edits it while it runs. A change
# is reviewed and versioned like any procedure revision.

# Stage agents of the inspection graph that are code, not models. They are agents
# all the same: each reaches only the tools listed here (workbench/tools.py).

document_reader:
  purpose: >
    Reads a document's pages: a PDF's own text where it has one, OCR where it
    does not. Every piece of text keeps its page and box.
  tools: [read_pages]

evidence_builder:
  purpose: >
    Places each value in its table cell and builds evidence records with page,
    box and crop. Stops the run when a critical value is doubtful.
  tools: [build_evidence, ground_truth_stand_in]

rules_engine:
  purpose: >
    Applies the escalation rules to the evidence, in code. No model, and nothing
    a model writes can change its outcome.
  tools: [apply_rules]

qa_checker:
  purpose: >
    Reads the finished note back and checks every value against its evidence
    record. It cannot write a note; it can only stamp checks that all passed.
  tools: [read_back_note, stamp_note]

reviewer:
  purpose: >
    An engineer, through the Review tab. Enters a value the scan could not give
    with certainty, read from the original report, or sends it for
    re-measurement. Code checks every entry against its printed column before the
    run continues, and records who entered what and what the scan had read.
  tools: []


planner:
  purpose: >
    Turns a request into a plan: which kinds of work the workbench already does to
    run, in what order, with what arguments -- or what cannot be done. It delegates
    only: it calls no tool, and code checks every plan before a step runs. A
    regulated request always runs the fixed inspection graph (workbench/planner.py).
  router_task: plan
  tools: []
  max_attempts: 2                  # a plan, and one re-plan after failed checks
  timeout_seconds: 300
  think: false
  options: {temperature: 0, num_ctx: 8192}

  instructions: |
    You plan work for an offline refinery inspection workbench. You do not do the work. First split the request into its parts, then choose the steps that do them.

    Rules:
    - parts: every thing the request asks for, in the request's own words, each with the step kind that does it, or "none" when no listed step kind can do it.
    - A part is "none" when it needs a report that the request does not name or that is not in the Documents list, when it needs documents the Library list does not hold, or when it is an action no listed step kind performs.
    - steps: the steps that do the parts, in the order the request asks. One step can do several parts; never list the same step twice. Fill in the arguments the step kind needs, and leave every other argument as an empty string.
    - doc_id: a report from the Documents list whose equipment tag the request names. Never choose a report the request does not name.
    - task_id: a coding task from the list, only when the request asks for what that task computes.
    - question: one self-contained question in plain words, for the library.
    - why: one short sentence saying which part of the request the step serves.
    - Do not add a step that no part asks for.
    - A request to read or review a report, or to draft an approval note, needs an inspection step for that report.
    - A greeting, thanks, a question about what the workbench can do, or a general question that needs none of the organisation's reports or documents: a reply step, with the message as its question.
    - not_possible: when a part gets no step, say briefly what cannot be done and why. Otherwise leave it empty. When no part can be done, return no steps.

  # The user message: the request and the catalogue, nothing from any earlier plan.
  request_template: |
    Request: {request}

    Step kinds:
    {step_kinds}

    Documents (inspection reports; doc_id: equipment tag):
    {documents}

    Coding tasks (task_id: what it computes):
    {tasks}

    Library (what the library step searches; document id: title):
    {library}

  # Earlier requests in the same chat, put before the request only when there are
  # any -- a first message is planned from exactly the prompt above. Newest last.
  # 0 = chat memory OFF (decided 2026-09-14): the Planner is qualified for single
  # messages only. Held-out follow-ups failed the gate (G04, results/stage3/NOTES.md §9).
  # Set to 3 again only after follow-ups pass a fresh held-out test.
  history_turns: 0
  history_template: |
    Earlier in this conversation, oldest first -- use it to tell what words like "it", "that report" or "the same" refer to. A report named here counts as named by the request. What was planned earlier has already run: plan only what the new request asks.
    {turns}

  history_turn: "- The person asked: {request}\n  The workbench planned: {plan}"
  history_nothing_planned: "nothing ({not_possible})"

  retry_instructions: |
    Your plan failed these checks: {problems}
    Plan again for the same request, fixing every problem. A part that cannot be done gets no step, and not_possible says why.

  messages:
    planned: "Planned by the Planner ({model}) and checked in code: {n} step(s)."
    partly: "Not in the plan, because no step can do it: {not_possible}"
    not_possible: "Nothing was planned: {not_possible}"
    failed_checks: "The Planner's plan did not pass its checks, so nothing was run: {problems}"
    no_model: "No model is qualified to plan ({reason}), so nothing was planned."
    error: "The planning model could not be reached ({error}), so nothing was planned."
    help: "What this workbench can do, on this machine:"      # shown with the catalogue when nothing was planned

  # The output contract, passed to the model server as a JSON schema. The only
  # choices for the kinds, doc_id and task_id are filled in by workbench/planner.py
  # from the catalogue; code checks every plan whether or not the server enforced
  # them. `parts` comes first, so the request is split before any step is chosen;
  # code then checks that parts and steps agree.
  output_schema:
    type: object
    properties:
      parts:
        type: array
        items:
          type: object
          properties:
            text: {type: string}
            kind: {type: string}
          required: [text, kind]
      steps:
        type: array
        items:
          type: object
          properties:
            kind: {type: string}
            doc_id: {type: string}
            question: {type: string}
            task_id: {type: string}
            why: {type: string}
          required: [kind, doc_id, question, task_id, why]
      not_possible: {type: string}
    required: [parts, steps, not_possible]


chat:
  purpose: >
    Answers greetings, questions about what the workbench can do, and general
    questions, in a few sentences. It calls no tool and has no access to the
    organisation's reports or documents; code refuses a reply that gives a verdict,
    names a report or document, or claims work was done (workbench/chat.py).
  router_task: reply
  tools: []
  max_attempts: 2                  # a reply, and one rewrite after failed checks
  max_words: 90
  timeout_seconds: 120
  think: false
  options: {temperature: 0.3, num_ctx: 4096}

  instructions: |
    You are the chat agent of an offline workbench used by refinery inspection engineers. You answer greetings, questions about what the workbench can do, and general questions, in plain text of at most {max_words} words.

    What the workbench can do when asked (other agents do this work, not you):
    {capabilities}

    Rules:
    - Answer only the message. Be brief, friendly and plain. No headings or lists unless asked.
    - You cannot see the organisation's reports, equipment data or documents. Do not name any report, equipment tag or document, and do not say what they contain. If asked about them, say the person can ask the workbench to read the report or search the library.
    - Never say that equipment is approved, cleared, safe to operate or fit for service. People decide that.
    - Do not say you have done any work such as reading, drafting, checking or sending. You only reply.
    - For a general question, answer from general knowledge, briefly, and say so when you are not sure.

  retry_instructions: "Your reply has these problems: {problems}. Write it again, fixing every problem."
  style_only: ["longer than"]      # style, not safety: accepted on the last attempt

  messages:
    label: "General answer by {model}, not from your documents. Checked in code for verdicts, document claims and claims of work done."
    failed_checks: "A reply was written but did not pass its checks, so it is not shown."
    no_model: "No model is qualified to reply ({reason})."
    error: "The model could not be reached ({error})."

  checks:
    # A claim that the chat agent did work. A reply does none: work is a planned step.
    claims_done: "\\bI(?:'ve| have)\\s+(?:already\\s+)?(?:read|drafted|written|checked|reviewed|run|sent|emailed|approved|inspected|searched)\\b"


librarian:
  purpose: >
    Answers questions from the reference library. Every sentence cites the
    passage that states it; when the library does not contain the answer, it
    says so instead of answering.
  router_task: answer_from_library
  tools: [search_library]
  max_attempts: 2                  # a first answer, and one rewrite after failed checks
  max_words: 150
  timeout_seconds: 600
  options: {temperature: 0.1, num_ctx: 8192}
  passage_label: "P{n}"            # how passages are numbered for the model, and cited back

  instructions: |
    You answer questions for refinery inspection engineers, using ONLY the numbered passages given with the question.

    Rules:
    - Every sentence of your answer lists in "sources" the labels of the passages that state it, for example ["P2"]. Cite only passages that actually say what the sentence says.
    - Copy numbers, units, dates, names, and document or clause identifiers exactly as the passages write them.
    - Every number, date and name in your answer must come from the passages. Do not repeat the question's own numbers, dates or names as facts unless a passage states them.
    - If the passages do not state what was asked, set "answerable" to false, leave "sentences" empty, and say briefly in "missing" what the passages do not contain. Do not use general knowledge, do not guess, and do not fill gaps.
    - When the question asks what a document or clause says, only that document's or clause's own text answers it. A passage from another document that refers to it or applies it does not give its wording; if its own text is not among the passages, it is not answerable.
    - A passage may refer to another document or section. Rely on that other text only if it is itself among the passages.
    - When one passage changes another for a period (a memo altering a procedure), say so and cite both.
    - Answer only the question asked, in at most {max_words} words. No advice or background.

  retry_instructions: |
    Your answer failed these checks: {problems}
    Answer again from the same passages, fixing every problem. Use only numbers, dates and names that the cited passages state. If the passages cannot support an answer, set "answerable" to false.

  # What the person asking sees when there is no checked answer.
  messages:
    no_model: "No model is qualified to answer from the library ({reason}). The passages the search found are listed below."
    not_in_library: "The library does not contain this: {missing}"
    failed_checks: "An answer was drafted but did not pass the checks against its sources, so it is not shown. The passages the search found are listed below."
    error: "The model could not be reached ({error}). The passages the search found are listed below."

  # The output contract, passed to the model server as a JSON schema.
  output_schema:
    type: object
    properties:
      answerable: {type: boolean}
      sentences:
        type: array
        items:
          type: object
          properties:
            text: {type: string}
            sources: {type: array, items: {type: string}}
          required: [text, sources]
      missing: {type: string}
    required: [answerable, sentences, missing]

  # What code checks before anyone sees an answer. Every item found in a sentence
  # must appear in the passages that sentence cites; identifiers use the library's
  # own identifier_patterns (workbench/library.yaml).
  checks:
    number: '\d+(?:[.,/:]\d+)*'
    quote: '["“]([^"”]{4,})["”]'
    proper_term: '\b[A-Z][A-Za-z]+\b'   # a capitalised word: must appear in the cited passages (see librarian._unsupported)
    sentence_end_min_letters: 4         # a stop ends a sentence only after a word this long: "Dr." and "R." do not
    style_only: ["longer than"]         # style, not safety: accepted on the last attempt


report_writer:
  purpose: >
    Writes the summary paragraph of a draft approval note from evidence records
    already in hand. Code checks every number and forbids approval language;
    after failed checks, code writes the summary instead.
  router_task: write_summary
  tools: [write_note]              # the summary is model text checked by code; the note file comes from the template
  max_attempts: 2
  max_words: 120                   # a summary longer than max_words + tolerance is a style problem
  tolerance_words: 10
  target_words: 110
  timeout_seconds: 300
  options: {temperature: 0.2, num_ctx: 4096}
  instructions: >-
    You write the summary paragraph of a DRAFT inspection approval note that engineers will
    review. Use only the facts given. Do not invent numbers, names or dates, and do not round
    numbers. Never say the equipment is approved, safe or fit for service: people decide that.
    Say what the rules engine concluded and why, mention the key findings, and say what needs
    engineering attention. Use the words Critical, Major, Minor and Observation only as the
    report's grades. Write 3 to 5 plain sentences, under {target_words} words: no headings, no lists, no sign-off.
  retry_instructions: "Your summary has these problems: {problems}. Rewrite it, fixing them, using only the facts given."
  style_only: ["longer than"]      # style problems: repaired if possible, never a reason to discard


coder:
  purpose: >
    Writes a small program, runs it in the sealed sandbox against acceptance
    tests it never sees, reads the failures, and fixes it -- within a budget.
  router_task: code
  tools: [sandbox]
  timeout_seconds: 600
  options: {temperature: 0.2, num_ctx: 8192}
  instructions: >-
    You write small, correct Python programs for an offline engineering workbench.
    Write ONE file. Use only the Python standard library -- there is no network and
    nothing is installed. Do not read or write files other than those described.
    Reply with a single ```python code block and nothing else.
  messages:                        # what the model is told between attempts: symptoms, never our test code
    no_code_block: "Reply with a single ```python code block."
    failed_tests: "Your program failed the acceptance tests.\n\n{report}\n\nFix the program and reply with the complete corrected file."
    timed_out: "Your program did not finish within the time limit. It is probably waiting or looping forever."
    silent_exit: "The program exited with code {code} and said nothing."
    # Sent in a fresh conversation when the model sends a program that already failed, unchanged.
    repeated: "This program was already tried and it failed:\n\n```python\n{program}\n```\n\nIt failed like this:\n\n{report}\n\nWrite a corrected program that fixes this failure. Reply with the complete file in a single ```python code block."
  repeat_options: {temperature: 0.7, num_ctx: 8192}   # for that fresh conversation: more variety than a repeat
  output_tail_chars: 2500          # how much of stdout and stderr the model sees


second_reader:
  purpose: >
    Reads a scanned report's page images into evidence records, as a second
    reading to compare with the OCR one. Not wired into the pipeline: never
    trusted alone (workbench/models.yaml, qwen3.5:9b limits).
  router_task: second_read
  tools: []
  timeout_seconds: 900
  think: false
  options: {temperature: 0, num_ctx: 16384}
  instructions: >-
    These are the page images of one scanned equipment inspection report, in order.
    Transcribe it into JSON. Copy every value exactly as printed: do not round, convert,
    correct or guess. Numbers: copy the digits as printed, without units (e.g. '15.6' for
    '15.6 barg'). Findings come from section 2, with the recommendation for the same Ref
    from section 4. Readings come from the ultrasonic thickness survey table, one per CML
    row. 'page' is the 1-based number of the page image the row is printed on.
    If a value is unreadable, use null. Reply with only a JSON object with exactly these
    keys (no other keys, no markdown):
  # The keys, spelled out after the instructions: Ollama did not enforce a JSON schema for
  # this model (it wrapped values as {"value": ...}), so the exact keys go in the prompt.
  template: '{"report_no": "", "equipment_tag": "", "equipment_name": "", "unit": "", "plant": "", "inspection_type": "", "inspection_date": "", "next_due_date": "", "inspector_name": "", "inspector_cert": "", "design_pressure_barg": "", "design_temp_c": "", "service_fluid": "", "year_built": "", "corrosion_rate_mm_yr": "", "remaining_life_yr": "", "findings": [{"finding_id": "", "page": 1, "location": "", "description": "", "severity": "", "ref_clause": "", "recommendation": ""}], "readings": [{"cml_id": "", "page": 1, "location": "", "nominal_mm": "", "previous_mm": "", "current_mm": "", "min_required_mm": "", "status": ""}]}'
