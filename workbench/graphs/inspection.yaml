# Procedural graph for the inspection workflow.
#
# Adapted from "Procedural Graphs: Self-Evolving Execution Structures for LLM
# Agents" (Lu, Chen, Wu, Arik; arXiv 2609.09153, Sep 2026). Nodes are stages;
# edges use the paper's relations and carry condition / guidance / pitfalls.
#
# The same file does two jobs (ARCHITECTURE section 3.3):
#   - the runner ENFORCES it: only these transitions are allowed, each stage
#     has a retry budget, and failures follow their `when: fail` edge;
#   - the guidance and pitfalls on a stage's edges are INSERTED into the
#     model's instructions when that stage uses a model.
#
# `when:` is our execution key (ok / fail / exhausted); the relation keeps the
# paper's vocabulary. (Not `on:` -- YAML 1.1 reads a bare `on` key as True.) Self-evolution (a refiner proposing edits from failed
# vs successful runs) is designed but off: an edit is committed only if it
# passes the validation set AND an engineer approves it (Management of Change).

graph: inspection
version: 3      # v3: a doubtful value goes to review_values, where a person enters it and the run resumes
                # v2: each stage runs as a defined agent (agent_id), held to that agent's tools
description: Scanned inspection report -> checked evidence -> rules -> draft approval note
start: read_document
step_budget: 20

# agent: the name people see. agent_id: the agent in workbench/agents.yaml the
# stage runs as -- it can reach only that agent's tools (workbench/tools.py).
nodes:
  read_document:  {kind: stage, agent: Document Reader,           agent_id: document_reader,  max_attempts: 2}
  build_evidence: {kind: stage, agent: Evidence Builder,          agent_id: evidence_builder, max_attempts: 2}
  apply_rules:    {kind: stage, agent: Rules Engine (code),       agent_id: rules_engine,     max_attempts: 1}
  write_summary:  {kind: stage, agent: Report Writer (model),     agent_id: report_writer,    max_attempts: 1}
  render_note:    {kind: stage, agent: Report Writer (template),  agent_id: report_writer,    max_attempts: 3}
  qa_check:       {kind: check, agent: QA Checker,                agent_id: qa_checker,       max_attempts: 1}
  # kind review: where the service runs it, the run pauses here and waits for an
  # engineer (workbench/graph_engine.py); where nobody can be asked (the command
  # line), the stage records that and the run ends at needs_review.
  review_values:  {kind: review, agent: Engineer (Review tab),    agent_id: reviewer,         max_attempts: 1}
  needs_review:   {kind: end,   agent: Person}
  done:           {kind: end,   agent: Person}

edges:
  - from: read_document
    relation: PROVIDES_INPUT_FOR
    to: build_evidence
    when: ok
    condition: text and tables read from every page
    guidance: keep the original page images; every value must be traceable to one
    pitfalls: a clean-looking summary paragraph is not the data -- the tables are

  - from: build_evidence
    relation: PROVIDES_INPUT_FOR
    to: apply_rules
    when: ok
    condition: every CML row has a current thickness and a minimum required value
    guidance: one evidence record per table row, including the thickness survey
    pitfalls: a routine-sounding summary does not mean no escalation; check every reading against its minimum

  - from: build_evidence
    relation: CONVERGES_TO
    to: review_values
    when: exhausted
    condition: a critical value is still missing or doubtful after re-reading
    guidance: show the reviewer the cell crop; never guess a digit

  - from: review_values
    relation: PROVIDES_INPUT_FOR
    to: apply_rules
    when: ok
    condition: an engineer entered every doubtful value from the original report, and each entry passed its column's checks
    guidance: record who entered each value and what the scan read; the rules run on the entered values
    pitfalls: an entry that does not match the column's printed precision is refused, never rounded

  - from: review_values
    relation: CONVERGES_TO
    to: needs_review
    when: fail
    condition: nobody could be asked, the engineer sent it for re-measurement, or no entry can resolve it

  - from: apply_rules
    relation: LEADS_TO
    to: write_summary
    when: ok
    condition: every rule evaluated, outcome recorded
    guidance: state the rules' outcome and its reason exactly as the rules engine gave it
    pitfalls: do not add a conclusion of your own; "no trigger" is not "fit for service"

  - from: write_summary
    relation: PROVIDES_INPUT_FOR
    to: render_note
    when: ok
    condition: the summary passed the number, wording and outcome checks
    guidance: numbers come only from the evidence; name every CML below its minimum
    pitfalls: never write "approved" or "fit for service"; never round a reading

  - from: render_note
    relation: LEADS_TO
    to: qa_check
    when: ok
    condition: the note file was written

  - from: qa_check
    relation: LEADS_TO
    to: done
    when: ok
    condition: every value read back from the file matches its evidence record

  - from: qa_check
    relation: TRIGGERS
    to: render_note
    when: fail
    condition: a value read back from the file differs from the evidence
    guidance: re-render from the same evidence records
    pitfalls: never edit a value in the file to make it match -- fix the rendering

  - from: render_note
    relation: CONVERGES_TO
    to: needs_review
    when: exhausted
    condition: the note still fails its checks after the retry budget
    guidance: hand the draft and the failed checks to a person
