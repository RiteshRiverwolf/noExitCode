<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workbench — Offline Inspection Assistant</title>
<style>
  /* Reset + scrollbars */
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #2b2b34 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2b2b34; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  html, body { height: 100%; margin: 0; }
  body { -webkit-font-smoothing: antialiased; }
  /* Form controls start plain (as Tailwind's preflight made them); the classes below style them */
  button, input, textarea { font: inherit; color: inherit; margin: 0; padding: 0; background-color: transparent; border: 0 solid; }
  button { cursor: pointer; }

  /* Palette (hand-vendored so no CDN/build step is needed — everything below
     runs from this one static file, offline) */
  :root {
    --base-950:#0a0a0d; --base-900:#121216; --base-850:#17171d; --base-800:#1e1e25; --base-700:#2b2b34; --base-600:#3f3f4a;
    --ink-100:#f4f4f6; --ink-200:#dcdce2; --ink-300:#c9c9d2; --ink-500:#8d8d9a; --ink-600:#6c6c78; --ink-700:#525260;
    --signal-ok:#34d399; --signal-warn:#fbbf24; --signal-danger:#fb7185;
    --indigo-200:#c7d2fe; --indigo-300:#a5b4fc; --indigo-400:#818cf8;
    --emerald-300:#6ee7b7; --emerald-400:#34d399;
    --amber-400:#fbbf24;
    --rose-300:#fda4af; --rose-400:#fb7185;
  }

  body {
    background-color: var(--base-950);
    background-image:
      radial-gradient(760px circle at 8% -8%, rgba(129,140,248,0.16), transparent 60%),
      radial-gradient(680px circle at 96% 8%, rgba(251,113,133,0.10), transparent 55%),
      radial-gradient(900px circle at 50% 115%, rgba(52,211,153,0.10), transparent 55%);
    background-attachment: fixed;
    color: var(--ink-100);
  }

  /* ---------- Component / animation classes ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,.4); }
    50% { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
  }

  .stage-active .stage-dot { animation: pulseWarn 1.4s ease-in-out infinite; }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,.45); }
    50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); }
  }

  .fade-swap { animation: fadeSwap .35s cubic-bezier(.16,1,.3,1); }
  @keyframes fadeSwap {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-line { animation: logIn .3s ease-out; }
  @keyframes logIn {
    from { opacity: 0; transform: translateX(-4px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .msg-in { animation: msgIn .35s cubic-bezier(.16,1,.3,1); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chip-in { animation: chipIn .25s cubic-bezier(.34,1.4,.64,1); }
  @keyframes chipIn {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .btn-lift { transition: transform .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .btn-lift:hover { transform: translateY(-1px); }
  .btn-lift:active { transform: translateY(0); }

  .send-btn {
    background: linear-gradient(135deg, #818cf8, #a78bfa);
    box-shadow: 0 2px 14px -2px rgba(129,140,248,.55);
  }
  .send-btn:hover { box-shadow: 0 4px 18px -2px rgba(129,140,248,.7); }

  .card-shadow { box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.5); }

  .drop-overlay { animation: fadeSwap .18s ease-out; }

  /* ---------- Utility layer (hand-written, mirrors the classes used below) ---------- */
  /* Positioning */
  .relative { position: relative; }
  .absolute { position: absolute; }
  .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
  .z-10 { z-index: 10; }

  /* Display */
  .grid { display: grid; }
  .inline-flex { display: inline-flex; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .block { display: block; }
  .hidden { display: none; } /* kept last among display rules so it always wins when toggled against flex/grid/block */

  /* Overflow (used by the layout below; missing from the first hand-written layer) */
  .overflow-hidden { overflow: hidden; }
  .overflow-y-auto { overflow-y: auto; }

  /* Flex / grid item behavior */
  .flex-1 { flex: 1 1 0%; }
  .shrink-0 { flex-shrink: 0; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .items-end { align-items: flex-end; }
  .justify-center { justify-content: center; }
  .justify-between { justify-content: space-between; }
  .grid-cols-1 { grid-template-columns: repeat(1, minmax(0,1fr)); }
  .grid-cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

  /* Gaps / stacked spacing */
  .gap-1\.5 { gap: .375rem; }
  .gap-2 { gap: .5rem; }
  .gap-3 { gap: .75rem; }
  .gap-4 { gap: 1rem; }
  .gap-px { gap: 1px; }
  .space-y-1 > * + * { margin-top: .25rem; }
  .space-y-2 > * + * { margin-top: .5rem; }
  .space-y-4 > * + * { margin-top: 1rem; }

  /* Margin / padding */
  .m-3 { margin: .75rem; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .mt-0\.5 { margin-top: .125rem; }
  .mt-1 { margin-top: .25rem; }
  .mt-2 { margin-top: .5rem; }
  .mt-4 { margin-top: 1rem; }
  .mb-1 { margin-bottom: .25rem; }
  .mb-2 { margin-bottom: .5rem; }
  .mr-1\.5 { margin-right: .375rem; }
  .my-1 { margin-top: .25rem; margin-bottom: .25rem; }
  .p-3 { padding: .75rem; }
  .px-2 { padding-left: .5rem; padding-right: .5rem; }
  .px-2\.5 { padding-left: .625rem; padding-right: .625rem; }
  .px-3 { padding-left: .75rem; padding-right: .75rem; }
  .px-4 { padding-left: 1rem; padding-right: 1rem; }
  .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
  .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
  .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
  .py-1\.5 { padding-top: .375rem; padding-bottom: .375rem; }
  .py-2 { padding-top: .5rem; padding-bottom: .5rem; }
  .py-2\.5 { padding-top: .625rem; padding-bottom: .625rem; }
  .py-3 { padding-top: .75rem; padding-bottom: .75rem; }
  .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
  .pb-2 { padding-bottom: .5rem; }
  .pb-3 { padding-bottom: .75rem; }
  .pb-6 { padding-bottom: 1.5rem; }
  .pt-2 { padding-top: .5rem; }
  .pl-2 { padding-left: .5rem; }
  .pr-1 { padding-right: .25rem; }

  /* Sizing */
  .w-1\.5 { width: .375rem; }
  .w-2\.5 { width: .625rem; }
  .w-4 { width: 1rem; }
  .w-6 { width: 1.5rem; }
  .w-7 { width: 1.75rem; }
  .w-8 { width: 2rem; }
  .w-56 { width: 14rem; }
  .w-full { width: 100%; }
  .w-px { width: 1px; }
  .h-1\.5 { height: .375rem; }
  .h-2\.5 { height: .625rem; }
  .h-4 { height: 1rem; }
  .h-6 { height: 1.5rem; }
  .h-7 { height: 1.75rem; }
  .h-8 { height: 2rem; }
  .h-screen { height: 100vh; }
  .h-\[2px\] { height: 2px; }
  .min-h-\[260px\] { min-height: 260px; }
  .min-h-\[320px\] { min-height: 320px; }
  .max-w-\[110px\] { max-width: 110px; }
  .max-h-32 { max-height: 8rem; }

  /* Typography */
  .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .font-medium { font-weight: 500; }
  .font-semibold { font-weight: 600; }
  .text-sm { font-size: .875rem; line-height: 1.25rem; }
  .text-\[11px\] { font-size: 11px; }
  .text-\[12px\] { font-size: 12px; }
  .text-\[12\.5px\] { font-size: 12.5px; }
  .text-\[13px\] { font-size: 13px; }
  .text-\[16px\] { font-size: 16px; }
  .tracking-tight { letter-spacing: -0.025em; }
  .tracking-wide { letter-spacing: 0.025em; }
  .uppercase { text-transform: uppercase; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leading-none { line-height: 1; }
  .leading-relaxed { line-height: 1.625; }
  .text-left { text-align: left; }
  .text-center { text-align: center; }

  /* Solid colors */
  .bg-base-700 { background-color: var(--base-700); }
  .bg-base-800 { background-color: var(--base-800); }
  .bg-base-850 { background-color: var(--base-850); }
  .bg-base-900 { background-color: var(--base-900); }
  .bg-amber-400 { background-color: var(--amber-400); }
  .bg-emerald-400 { background-color: var(--emerald-400); }
  .bg-indigo-400 { background-color: var(--indigo-400); }
  .bg-rose-400 { background-color: var(--rose-400); }
  .bg-signal-ok { background-color: var(--signal-ok); }
  .bg-signal-warn { background-color: var(--signal-warn); }
  .bg-signal-danger { background-color: var(--signal-danger); }
  .bg-transparent { background-color: transparent; }
  .border-base-600 { border-color: var(--base-600); }
  .border-base-700 { border-color: var(--base-700); }
  .border-base-800 { border-color: var(--base-800); }
  .border-indigo-400 { border-color: var(--indigo-400); }
  .text-ink-100 { color: var(--ink-100); }
  .text-ink-200 { color: var(--ink-200); }
  .text-ink-300 { color: var(--ink-300); }
  .text-ink-500 { color: var(--ink-500); }
  .text-ink-600 { color: var(--ink-600); }
  .text-ink-700 { color: var(--ink-700); }
  .text-emerald-300 { color: var(--emerald-300); }
  .text-indigo-200 { color: var(--indigo-200); }
  .text-indigo-300 { color: var(--indigo-300); }
  .text-rose-300 { color: var(--rose-300); }
  .text-signal-ok { color: var(--signal-ok); }
  .text-signal-warn { color: var(--signal-warn); }
  .text-signal-danger { color: var(--signal-danger); }
  .text-white { color: #fff; }

  /* Opacity-variant colors (named literally, same values Tailwind would emit) */
  .bg-emerald-400\/\[0\.06\] { background-color: rgba(52,211,153,.06); }
  .bg-indigo-400\/\[0\.06\] { background-color: rgba(129,140,248,.06); }
  .bg-indigo-400\/\[0\.08\] { background-color: rgba(129,140,248,.08); }
  .bg-indigo-400\/10 { background-color: rgba(129,140,248,.10); }
  .bg-rose-400\/10 { background-color: rgba(251,113,133,.10); }
  .bg-rose-400\/15 { background-color: rgba(251,113,133,.15); }
  .bg-base-950\/85 { background-color: rgba(10,10,13,.85); }
  .bg-signal-ok\/40 { background-color: rgba(52,211,153,.4); }
  .border-emerald-400\/25 { border-color: rgba(52,211,153,.25); }
  .border-indigo-400\/25 { border-color: rgba(129,140,248,.25); }
  .border-rose-400\/30 { border-color: rgba(251,113,133,.30); }
  .text-indigo-400\/60 { color: rgba(129,140,248,.60); }
  .ring-1.ring-inset.ring-rose-400\/40 { box-shadow: inset 0 0 0 1px rgba(251,113,133,.40); }

  /* Borders / radius */
  .border { border-width: 1px; border-style: solid; }
  .border-2 { border-width: 2px; border-style: solid; }
  .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
  .border-t { border-top-width: 1px; border-top-style: solid; }
  .border-r { border-right-width: 1px; border-right-style: solid; }
  .border-dashed { border-style: dashed; }
  .rounded { border-radius: .25rem; }
  .rounded-md { border-radius: .375rem; }
  .rounded-lg { border-radius: .5rem; }
  .rounded-full { border-radius: 9999px; }
  .rounded-none { border-radius: 0; }
  .rounded-tl-sm { border-top-left-radius: .125rem; } /* after rounded-lg on purpose: overrides just that corner */

  /* Effects */
  .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .transition-colors { transition-property: color, background-color, border-color; transition-duration: .15s; transition-timing-function: ease; }
  .transition-transform { transition-property: transform; transition-duration: .15s; transition-timing-function: ease; }
  .outline-none { outline: none; }
  .resize-none { resize: none; }

  /* Pseudo-classes */
  .hover\:bg-base-900:hover { background-color: var(--base-900); }
  .hover\:bg-indigo-400\/10:hover { background-color: rgba(129,140,248,.10); }
  .hover\:bg-indigo-400\/30:hover { background-color: rgba(129,140,248,.30); }
  .hover\:border-indigo-400\/40:hover { border-color: rgba(129,140,248,.40); }
  .hover\:text-indigo-200:hover { color: var(--indigo-200); }
  .hover\:text-indigo-300:hover { color: var(--indigo-300); }
  .hover\:text-ink-300:hover { color: var(--ink-300); }
  .hover\:text-white:hover { color: #fff; }
  .focus-within\:border-indigo-400\/50:focus-within { border-color: rgba(129,140,248,.50); }
  .placeholder\:text-ink-600::placeholder { color: var(--ink-600); }

  /* Responsive (matches Tailwind's default md/lg breakpoints) */
  @media (min-width: 768px) {
    .md\:flex { display: flex; }
  }
  @media (min-width: 1024px) {
    .lg\:flex-row { flex-direction: row; }
    .lg\:border-b-0 { border-bottom-width: 0; }
  }

  /* ---------- Collapsible sidebar ---------- */
  #sidebar { transition: width .22s ease, min-width .22s ease, border-color .22s ease; overflow: hidden; }
  #sidebar.sidebar-collapsed { width: 0 !important; min-width: 0 !important; border-right-color: transparent; }

  /* ---------- Resizable panels ---------- */
  #agentPanel, #requestPanel, #evidencePanel { min-width: 260px; }
  @media (min-width: 1024px) {
    #agentPanel { flex: 3 3 0; }
    #requestPanel { flex: 4 4 0; }
    #evidencePanel { flex: 3 3 0; }
  }
  @media (max-width: 1023.98px) {
    #agentPanel, #requestPanel, #evidencePanel { flex: 1 1 auto !important; width: auto !important; }
  }
  .resize-handle { display: none; flex: 0 0 6px; position: relative; cursor: col-resize; touch-action: none; }
  .resize-handle::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
    background: var(--base-800); transition: background-color .15s ease;
  }
  .resize-handle:hover::after, .resize-handle.dragging::after { background: var(--indigo-400); }
  @media (min-width: 1024px) {
    .resize-handle { display: block; }
  }

  /* ---------- Live wiring: tabs, evidence table, cards (added 2026-09-13) ---------- */
  .tab { font: inherit; font-size: 12px; padding: .2rem .55rem; border-radius: .375rem; color: var(--ink-500); border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .tabs-row { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  .tabs-row::-webkit-scrollbar { display: none; }
  .tab:hover { color: var(--ink-200); }
  .tab.active { color: var(--ink-100); border-color: var(--base-700); background: var(--base-900); }
  .badge { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 4px; border-radius: 9999px; font-size: 10px; line-height: 16px; text-align: center; background: rgba(251,113,133,.2); color: var(--rose-300); }
  .badge.hidden { display: none; }
  .card { border: 1px solid var(--base-800); border-radius: .5rem; background: var(--base-900); padding: .75rem; }
  .pill { display: inline-block; font-size: 10.5px; line-height: 16px; padding: 0 .45rem; border-radius: 9999px; border: 1px solid var(--base-700); color: var(--ink-500); font-weight: 400; vertical-align: middle; }
  .pill.ok { color: var(--emerald-300); border-color: rgba(52,211,153,.3); }
  .pill.warn { color: var(--signal-warn); border-color: rgba(251,191,36,.35); }
  .pill.bad { color: var(--rose-300); border-color: rgba(251,113,133,.35); }
  .pill.info { color: var(--indigo-200); border-color: rgba(129,140,248,.35); }
  .demo-btn { font: inherit; font-size: 11.5px; padding: .2rem .6rem; border-radius: .375rem; border: 1px solid rgba(129,140,248,.35); color: var(--indigo-200); background: rgba(129,140,248,.08); cursor: pointer; }
  .demo-btn:hover { background: rgba(129,140,248,.18); }
  .demo-btn:disabled { opacity: .45; cursor: not-allowed; }
  .review-field { width: 100%; font: inherit; font-size: 12.5px; padding: .3rem .5rem; border-radius: .375rem; border: 1px solid rgba(148,163,184,.3); background: rgba(15,23,42,.35); color: inherit; }
  .review-field:focus { outline: none; border-color: rgba(129,140,248,.6); }
  .review-field:disabled { opacity: .6; }
  .review-field option { color: #0f172a; }
  .ev-table { width: 100%; border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .ev-table th { text-align: left; color: var(--ink-500); font-weight: 500; padding: .3rem .4rem; background: var(--base-850); }
  .ev-table td { padding: .3rem .4rem; border-top: 1px solid var(--base-800); color: var(--ink-300); }
  .ev-table tr.breach td { color: var(--rose-300); background: rgba(251,113,133,.10); }
  .ev-table tr.doubt td { color: var(--signal-warn); background: rgba(251,191,36,.08); }
  .crop { display: block; max-width: 100%; border: 1px solid var(--base-700); border-radius: .25rem; background: #fff; }
  .code-block { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; overflow: auto; background: var(--base-950); border: 1px solid var(--base-800); border-radius: .375rem; padding: .5rem; color: var(--ink-300); max-height: 16rem; margin: .5rem 0 0; }
  .group-head { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--indigo-300); margin: .5rem 0 .35rem; }
  .group-caption { font-size: 11.5px; color: var(--ink-600); margin: 0 0 .75rem; line-height: 1.45; }
  .kv { display: flex; justify-content: space-between; gap: .75rem; font-size: 12px; }
  .kv > span:first-child { color: var(--ink-600); }
  .kv > span:last-child { color: var(--ink-300); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: right; }
  .chat-link { color: var(--indigo-300); text-decoration: none; border-bottom: 1px solid rgba(165,180,252,.35); }
  .chat-link:hover { color: var(--indigo-200); }
</style>
</head>
<body class="text-ink-100 font-sans antialiased h-screen flex overflow-hidden">

  <aside id="sidebar" class="w-56 shrink-0 border-r border-base-800 hidden md:flex flex-col">
    <button id="sidebarNewChat" class="btn-lift m-3 flex items-center gap-2 px-3 py-2 rounded-lg border border-base-700 bg-base-900 text-[12.5px] text-ink-300 hover:border-indigo-400/40 hover:text-indigo-200 transition-colors">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="px-3 pb-2 text-[11px] uppercase tracking-wide text-ink-700">Past chats</div>
    <div id="historyList" class="flex-1 overflow-y-auto px-2 pb-3 space-y-1"></div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
  <header class="flex items-center justify-between px-5 py-3 border-b border-base-800 shrink-0">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" title="Toggle past chats" class="w-7 h-7 rounded-md flex items-center justify-center text-ink-500 hover:text-indigo-300 hover:bg-indigo-400/10 transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, rgba(129,140,248,.18), rgba(167,139,250,.10)); border: 1px solid rgba(129,140,248,.35);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="1.6">
          <rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/>
          <rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
        </svg>
      </div>
      <div>
        <div class="text-sm font-semibold tracking-tight text-ink-100">Workbench</div>
        <div class="text-[11px] text-ink-600 leading-none">Offline Inspection Assistant</div>
      </div>
    </div>

    <div id="airPill" class="flex items-center gap-2 text-[12px] px-3 py-1.5 rounded-full border border-emerald-400/25 bg-emerald-400/[0.06]" title="A live snapshot of the connections held by the workbench's own processes (netstat), refreshed every few seconds. Not a packet capture.">
      <span id="airDot" class="w-1.5 h-1.5 rounded-full bg-signal-ok pulse-dot"></span>
      <span class="text-emerald-300">Air-gapped</span>
      <span class="text-ink-600">·</span>
      <span id="extLabel" class="text-ink-500">checking…</span>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <!-- AGENT ACTIVITY -->
    <section id="agentPanel" class="reveal flex flex-col border-b lg:border-b-0 border-base-800 min-h-[320px] overflow-hidden">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #fbbf24, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <span class="text-[13px] font-medium text-ink-200 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          Agent Activity
        </span>
        <span id="elapsed" class="text-[11px] text-ink-600 font-mono">idle</span>
      </div>

      <div id="stageList" class="flex-1 overflow-y-auto px-4 py-4">
        <!-- live agent events rendered by JS -->
      </div>
    </section>

    <div id="handle1" class="resize-handle"></div>

    <!-- PROMPT / CONVERSATION -->
    <section id="requestPanel" class="relative reveal flex flex-col border-b lg:border-b-0 border-base-800 min-h-[260px] overflow-hidden">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #818cf8, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <span class="text-[13px] font-medium text-ink-200 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
          Request
        </span>
        <div class="flex items-center gap-2">
          <button id="demoBtnHeader" class="demo-btn" title="Run the pitch demo: every step is a real run">Run demo</button>
          <button id="newChatBtn" title="New chat" class="w-6 h-6 rounded-md flex items-center justify-center text-ink-500 hover:text-indigo-300 hover:bg-indigo-400/10 transition-colors">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>

      <div id="chatScroll" class="flex-1 overflow-y-auto relative">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
          <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#c7d2fe"/>
                <stop offset="100%" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="40" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="205 46" stroke-dashoffset="15" transform="rotate(-90 50 50)"/>
            <circle cx="50" cy="50" r="13" fill="url(#brandGrad)"/>
          </svg>
          <div id="greetingText" class="text-[16px] font-medium text-ink-100 mt-4"></div>
          <div class="text-[12px] text-ink-600 mt-1">What should we look into today?</div>
          <button id="demoBtnEmpty" class="demo-btn mt-4">Run the R-2247 demo mission</button>
          <div id="healthLine" class="text-[11px] text-ink-700 mt-2"></div>
        </div>
        <div id="chatThread" class="px-4 py-4 space-y-4 text-[13px] leading-relaxed"></div>
      </div>

      <div id="stagedRow" class="hidden px-3 pt-2 flex flex-wrap gap-1.5 shrink-0"></div>

      <div class="p-3 border-t border-base-800 shrink-0">
        <div class="flex items-end gap-2 bg-base-900 border border-base-700 rounded-lg px-2 py-2 focus-within:border-indigo-400/50 transition-colors">
          <input id="fileInput" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" class="hidden" />
          <button id="attachBtn" class="shrink-0 w-7 h-7 rounded-md flex items-center justify-center text-ink-500 hover:text-indigo-300 hover:bg-indigo-400/10 transition-colors">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="promptInput" rows="1" placeholder="Ask for work in plain words, attach a report, or run the demo…" class="flex-1 bg-transparent resize-none outline-none text-[13px] text-ink-100 placeholder:text-ink-600 py-1"></textarea>
          <button id="runBtn" class="btn-lift send-btn shrink-0 w-7 h-7 rounded-md text-white flex items-center justify-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div id="dropOverlay" class="hidden absolute inset-0 z-10 items-center justify-center border-2 border-dashed border-indigo-400 rounded-none bg-base-950/85 backdrop-blur-sm drop-overlay">
        <div class="text-center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.5" class="mx-auto mb-2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <div class="text-[13px] text-indigo-200">Drop to attach</div>
        </div>
      </div>
    </section>

    <div id="handle2" class="resize-handle"></div>

    <!-- EVIDENCE · WHY THIS MODEL · REVIEW -->
    <section id="evidencePanel" class="reveal flex flex-col min-h-[320px] overflow-hidden">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #fb7185, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-1.5 tabs-row">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-400 mr-1.5" style="flex-shrink:0"></span>
          <button class="tab active" data-tab="evidence">Evidence</button>
          <button class="tab" data-tab="router">Why this model</button>
          <button class="tab" data-tab="review">Review<span id="reviewBadge" class="badge hidden">0</span></button>
        </div>
        <span id="evidenceStatus" class="text-[11px] text-ink-600 font-mono">—</span>
      </div>

      <div id="evidenceBody" class="flex-1 overflow-y-auto px-4 py-4 text-[13px]"></div>
      <div id="routerBody" class="hidden flex-1 overflow-y-auto px-4 py-4 text-[13px]"></div>
      <div id="reviewBody" class="hidden flex-1 overflow-y-auto px-4 py-4 text-[13px]"></div>
    </section>
  </main>

  <!-- NETWORK MONITOR -->
  <footer class="border-t border-base-800 shrink-0">
    <button id="netToggle" class="w-full flex items-center justify-between px-5 py-2 text-[12px] hover:bg-base-900 transition-colors">
      <div class="flex items-center gap-4 font-mono">
        <span class="flex items-center gap-1.5 text-ink-300">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          Network
        </span>
        <span class="text-ink-600">external connections <span id="extCount" class="text-signal-ok">–</span></span>
        <span class="text-ink-600">local connections <span id="localCount" class="text-ink-300">–</span></span>
        <span class="text-ink-600">audit logs intact <span id="logsIntact" class="text-ink-300">–</span></span>
      </div>
      <svg id="netChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-ink-500 transition-transform">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>
    <div id="netLog" class="hidden border-t border-base-800 bg-base-900 max-h-32 overflow-y-auto px-5 py-2 font-mono text-[11px] space-y-1"></div>
  </footer>
  </div>

<script>
  document.querySelectorAll('.reveal').forEach((el, i) => {
    setTimeout(() => el.classList.add('in'), 80 + i * 90);
  });

  // Everything below talks to the workbench service that serves this page
  // (python -m workbench.server). Nothing is simulated: agents, evidence, model
  // choices and network counts all come from the service's own events and endpoints.
  const served = location.protocol === 'http:' || location.protocol === 'https:';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function api(path, options) {
    const r = await fetch(path, options);
    let body = null;
    try { body = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok) throw new Error((body && body.error) || `${r.status} ${r.statusText}`);
    return body;
  }

  // ---------- File upload ----------
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const stagedRow = document.getElementById('stagedRow');
  const requestPanel = document.getElementById('requestPanel');
  const dropOverlay = document.getElementById('dropOverlay');
  let stagedFiles = [];

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function fileIconPath(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['png','jpg','jpeg','gif','webp','tif','tiff'].includes(ext)) {
      return '<circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/><rect x="3" y="3" width="18" height="18" rx="2"/>';
    }
    return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>';
  }

  function renderStaged() {
    if (stagedFiles.length === 0) {
      stagedRow.classList.add('hidden');
      stagedRow.innerHTML = '';
      return;
    }
    stagedRow.classList.remove('hidden');
    stagedRow.innerHTML = stagedFiles.map((f, i) => `
      <div class="chip-in inline-flex items-center gap-1.5 text-[11px] text-indigo-200 border border-indigo-400/25 bg-indigo-400/[0.08] rounded-md pl-2 pr-1 py-1">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${fileIconPath(f.name)}</svg>
        <span class="max-w-[110px] truncate">${esc(f.name)}</span>
        <span class="text-indigo-400/60">${formatBytes(f.size)}</span>
        <button data-i="${i}" class="removeChip w-4 h-4 rounded flex items-center justify-center text-indigo-300 hover:text-white hover:bg-indigo-400/30">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`).join('');
    stagedRow.querySelectorAll('.removeChip').forEach(btn => {
      btn.addEventListener('click', () => {
        stagedFiles.splice(Number(btn.dataset.i), 1);
        renderStaged();
      });
    });
  }

  function addFiles(fileListLike) {
    Array.from(fileListLike).forEach(f => stagedFiles.push(f));
    renderStaged();
  }

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });

  let dragDepth = 0;
  requestPanel.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.remove('hidden');
    dropOverlay.classList.add('flex');
  });
  requestPanel.addEventListener('dragover', (e) => e.preventDefault());
  requestPanel.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) { dropOverlay.classList.add('hidden'); dropOverlay.classList.remove('flex'); }
  });
  requestPanel.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.add('hidden');
    dropOverlay.classList.remove('flex');
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- Agent activity (live events) ----------
  const stageList = document.getElementById('stageList');
  let activity = [];   // groups (a mission step) and rows (one agent doing one thing)

  const DOT = {
    active: 'bg-signal-warn stage-dot', ok: 'bg-signal-ok', fail: 'bg-signal-danger',
    stop: 'bg-signal-warn', info: 'bg-indigo-400', idle: 'bg-base-700 border border-base-600',
  };

  function resetActivity() { activity = []; renderActivity(); }

  function addGroup(title, caption) {
    activity.push({ kind: 'group', key: 'group-' + activity.length, title, caption });
    renderActivity();
  }

  function upsertRow(key, row) {
    const i = activity.findIndex(a => a.key === key);
    if (i >= 0) activity[i] = { ...activity[i], ...row };
    else activity.push({ kind: 'row', key, status: 'info', ...row });
    renderActivity();
  }

  function renderActivity() {
    if (!activity.length) {
      stageList.innerHTML = `<div class="text-[12px] text-ink-600 leading-relaxed">Agents appear here as they work. Every line is a real event from the workbench service — which agent, what it did, whether it passed, and when work was sent back.</div>`;
      return;
    }
    stageList.innerHTML = activity.map((a, i) => {
      if (a.kind === 'group') {
        return `<div class="group-head">${esc(a.title)}</div>${a.caption ? `<div class="group-caption">${esc(a.caption)}</div>` : ''}`;
      }
      const next = activity[i + 1];
      const joined = next && next.kind === 'row';
      const textClass = a.status === 'active' ? 'text-ink-100' : 'text-ink-300';
      return `
        <div class="flex gap-3 ${a.status === 'active' ? 'stage-active' : ''}">
          <div class="flex flex-col items-center">
            <div class="w-2.5 h-2.5 rounded-full ${DOT[a.status] || DOT.info} mt-1 shrink-0"></div>
            ${joined ? `<div class="w-px flex-1 ${a.status === 'ok' ? 'bg-signal-ok/40' : 'bg-base-800'} my-1"></div>` : ''}
          </div>
          <div class="pb-3" style="min-width:0">
            <div class="text-[13px] font-medium ${textClass}">${esc(a.agent)}${a.tag ? ` <span class="pill ${a.tagClass || ''}">${esc(a.tag)}</span>` : ''}</div>
            <div class="text-[12px] text-ink-600 mt-0.5" style="word-break:break-word">${esc(a.detail || '')}</div>
            ${toolLine(a.tools)}
          </div>
        </div>`;
    }).join('');
    stageList.scrollTop = stageList.scrollHeight;
  }

  // Calls through the tool gate (workbench/tools.py), under the row of the agent that made them.
  function toolLine(calls) {
    if (!calls || !calls.length) return '';
    return `<div class="font-mono mt-1" style="font-size:10.5px;word-break:break-word">${calls.map(t => t.status === 'refused'
      ? `<span class="text-signal-danger">${esc(t.tool)} refused — ${esc(t.reason)}</span>`
      : `<span class="${t.status === 'ok' ? 'text-ink-600' : 'text-signal-danger'}">${esc(t.tool)} ${t.status === 'ok' ? '✓' : '✗'} ${esc(t.seconds)}s</span>`).join(' · ')}</div>`;
  }

  const agentLabel = id => String(id).split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

  resetActivity();

  // ---------- Network (live snapshot from the service) ----------
  const netLog = document.getElementById('netLog');
  let lastNetSignature = '';

  function logNet(text, kind) {
    const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const color = kind === 'external' ? 'text-signal-danger' : 'text-signal-ok';
    const tag = kind === 'external' ? 'EXTERNAL' : 'LOCAL';
    const line = document.createElement('div');
    line.className = 'log-line flex gap-2';
    line.innerHTML = `<span class="text-ink-700">${t}</span><span class="${color}">${tag}</span><span class="text-ink-500">${esc(text)}</span>`;
    netLog.appendChild(line);
    netLog.scrollTop = netLog.scrollHeight;
  }

  async function pollNetwork() {
    if (!served) return;
    try {
      const n = await api('/api/network');
      const ext = n.external_count, local = n.loopback_count + n.local_network_count;
      const logs = n.audit_logs || [], intact = logs.filter(l => l.chain_intact).length;
      const extEl = document.getElementById('extCount');
      extEl.textContent = ext;
      extEl.className = ext ? 'text-signal-danger' : 'text-signal-ok';
      document.getElementById('localCount').textContent = local;
      document.getElementById('logsIntact').textContent = `${intact}/${logs.length}`;
      document.getElementById('extLabel').textContent = `${ext} external connection${ext === 1 ? '' : 's'}`;
      document.getElementById('airDot').className = `w-1.5 h-1.5 rounded-full ${ext ? 'bg-signal-danger' : 'bg-signal-ok pulse-dot'}`;
      const signature = `${ext}|${local}|${intact}/${logs.length}`;
      if (signature !== lastNetSignature) {
        lastNetSignature = signature;
        logNet(`${local} local connection(s) held by ${(n.watched_processes || []).join(', ') || 'the workbench'} · audit logs intact ${intact}/${logs.length}`, 'local');
        (n.external || []).forEach(c => logNet(`${c.process} → ${c.foreign}`, 'external'));
      }
    } catch (e) {
      document.getElementById('extLabel').textContent = 'service not reachable';
    }
  }

  document.getElementById('netToggle').addEventListener('click', () => {
    netLog.classList.toggle('hidden');
    document.getElementById('netChevron').style.transform =
      netLog.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
  });

  // ---------- Right panel: Evidence · Why this model · Review ----------
  const evidenceBody = document.getElementById('evidenceBody');
  const routerBody = document.getElementById('routerBody');
  const reviewBody = document.getElementById('reviewBody');
  const evidenceStatus = document.getElementById('evidenceStatus');
  const reviewBadge = document.getElementById('reviewBadge');

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    evidenceBody.classList.toggle('hidden', name !== 'evidence');
    routerBody.classList.toggle('hidden', name !== 'router');
    reviewBody.classList.toggle('hidden', name !== 'review');
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

  function resetEvidence() {
    evidenceStatus.textContent = '—';
    evidenceStatus.className = 'text-[11px] text-ink-600 font-mono';
    evidenceBody.dataset.empty = 'yes';
    evidenceBody.innerHTML = `<div class="text-ink-600 text-[12px] leading-relaxed">Evidence will appear here once a reading is extracted — every value shown is linked back to its exact source cell.</div>`;
    reviewBody.innerHTML = `<div class="text-ink-600 text-[12px] leading-relaxed">When a value cannot be read with certainty, the run stops and the cell is shown here for an engineer. Nothing is guessed.</div>`;
    reviewBadge.classList.add('hidden');
    showTab('evidence');
  }

  function addCard(html, id) {
    if (evidenceBody.dataset.empty !== 'no') { evidenceBody.innerHTML = ''; evidenceBody.dataset.empty = 'no'; }
    const existing = id && document.getElementById(id);
    if (existing) { existing.innerHTML = html; return existing; }   // a re-read of the same run replaces its card
    const div = document.createElement('div');
    div.className = 'fade-swap card card-shadow mb-2';
    if (id) div.id = id;
    div.innerHTML = html;
    evidenceBody.prepend(div);
    evidenceBody.scrollTop = 0;
    return div;
  }

  const kv = (k, v) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`;

  function renderEvidence(e, runId) {
    const doubt = e.readings.filter(r => r.review_status === 'needs review');
    const rows = e.readings.map(r => `
      <tr data-cml="${esc(r.cml_id)}" class="${r.review_status === 'needs review' ? 'doubt' : ''}">
        <td>${esc(r.cml_id)}</td><td>${esc(r.previous_mm ?? '—')}</td><td>${esc(r.current_mm ?? 'unread')}</td>
        <td>${esc(r.min_required_mm ?? '—')}</td><td>${r.score != null ? Number(r.score).toFixed(2) : ''}</td>
      </tr>`).join('');
    const grades = e.findings.map(f => `${f.finding_id} ${f.severity || 'unread'}`).join(' · ');
    const readBy = (e.readings[0] && e.readings[0].read_by) || e.extraction || '';
    addCard(`
      <div class="flex items-center justify-between mb-2">
        <span class="text-[12.5px] text-ink-100 font-medium">Thickness survey</span>
        <span class="pill ${doubt.length ? 'warn' : 'info'}">${e.readings.length} readings · ${e.findings.length} findings</span>
      </div>
      <table class="ev-table"><thead><tr><th>CML</th><th>Prev.</th><th>Current</th><th>Min.</th><th>conf.</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="text-[11px] text-ink-600 mt-2">${esc(grades)}</div>
      <div class="text-[11px] text-ink-700 mt-1">read by ${esc(readBy)} · values kept exactly as printed</div>
      <div class="decision-slot mt-2"></div>
      <div class="crop-slot mt-2 space-y-2"></div>
      ${e.problems && e.problems.length ? `<div class="text-[11px] text-ink-600 mt-2">recorded: ${esc(e.problems.join('; '))}</div>` : ''}`,
      `ev-${runId}`);
    lastEvidence[runId] = e;
    evidenceStatus.textContent = doubt.length ? `${doubt.length} to review` : `${e.readings.length} readings`;
    evidenceStatus.className = `text-[11px] font-mono ${doubt.length ? 'text-signal-warn' : 'text-ink-500'}`;
  }

  function renderDecision(e, runId) {
    const card = document.getElementById(`ev-${runId}`);
    if (!card) return;
    const subjects = new Set(e.triggers.map(t => t.subject));
    card.querySelectorAll('tr[data-cml]').forEach(tr => { if (subjects.has(tr.dataset.cml)) tr.classList.add('breach'); });
    const escalate = e.outcome === 'ESCALATE';
    card.querySelector('.decision-slot').innerHTML = `
      <div class="border ${escalate ? 'border-rose-400/30 bg-rose-400/10' : 'border-base-700 bg-base-850'} rounded-lg px-3 py-2 text-[12px] text-ink-200">
        <span class="font-medium ${escalate ? 'text-rose-300' : 'text-ink-100'}">${esc(e.outcome)}</span> — decided by the rules engine, in code (${esc(e.ruleset)})
        ${e.triggers.map(t => `<div class="text-[11.5px] text-ink-300 mt-1">${esc(t.rule_id)} · ${esc(t.subject)} · ${esc(t.detail)}</div>`).join('')}
      </div>`;
    const ev = lastEvidence[runId];
    if (ev) {
      const crops = ev.readings.filter(r => subjects.has(r.cml_id) && r.crop_url);
      card.querySelector('.crop-slot').innerHTML = crops.map(r => `
        <div><div class="text-[11px] text-ink-600 mb-1">${esc(r.cml_id)} as printed on page ${esc(r.page)} — the cell the value was read from</div>
        <img class="crop" src="${esc(r.crop_url)}" alt="scan crop of ${esc(r.cml_id)}"></div>`).join('');
    }
  }

  // A paused run: each doubtful value with its crop, an entry per value, the engineer's name.
  // The service checks every entry against its column; nothing here decides.
  function renderReview(e) {
    const items = e.items || [];
    const placeholder = it => it.decimals == null ? 'as printed' : `as printed, ${it.decimals} decimal${it.decimals === 1 ? '' : 's'}`;
    reviewBody.innerHTML = `
      <div class="card card-shadow mb-2 fade-swap">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[13px] text-ink-100 font-medium">${esc(e.doc_id)} · paused for a person</span>
          <span class="pill warn">run paused</span>
        </div>
        <div class="text-[12px] text-ink-300 leading-relaxed">${esc(e.reason)}. The run stopped instead of guessing. Read each value from the original report and enter it exactly as printed; the run then resumes from this step.</div>
      </div>
      ${items.map(it => `
      <div class="card card-shadow mb-2 fade-swap">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[13px] text-ink-100 font-medium">${esc(it.label)}</span>
          <span class="pill warn">needs a person</span>
        </div>
        ${it.crop_url ? `<img class="crop" src="${esc(it.crop_url)}" alt="the cell as scanned">` : ''}
        <div class="space-y-1 mt-2">
          ${kv('Location', it.location || '—')}
          ${kv('Read by the scan as', it.read_as ?? 'unread')}
          ${it.kind === 'thickness' ? kv('Minimum required', it.min_required_mm ?? '—') : ''}
          ${it.kind === 'thickness' && it.decimals != null ? kv('Column prints', `${it.decimals} decimal${it.decimals === 1 ? '' : 's'}`) : ''}
          ${kv('Page · box', `${it.page ?? '—'} · ${(it.bbox || []).map(v => Math.round(v)).join(', ')}`)}
          ${kv('Recogniser confidence', it.score != null ? Number(it.score).toFixed(3) : '—')}
        </div>
        ${it.why && it.why.length ? `<div class="text-[12px] text-signal-warn mt-2">${esc(it.why.join('; '))}</div>` : ''}
        <label class="block text-[11.5px] text-ink-500 mt-2">Value on the original report</label>
        ${it.kind === 'grade'
          ? `<select class="review-field review-input mt-1" data-field="${esc(it.field)}"><option value="">choose…</option>${(it.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select>`
          : `<input class="review-field review-input mt-1 font-mono" data-field="${esc(it.field)}" inputmode="decimal" autocomplete="off" placeholder="${esc(placeholder(it))}">`}
      </div>`).join('')}
      <div class="card card-shadow mb-2">
        <label class="block text-[11.5px] text-ink-500">Your name — recorded with every value you enter</label>
        <input class="review-field review-name mt-1" autocomplete="name">
        <div class="flex gap-2 mt-2 flex-wrap">
          <button class="demo-btn review-action" data-action="confirm">Confirm values and resume</button>
          <button class="demo-btn review-action" data-action="remeasure">Send for re-measurement</button>
        </div>
        <div class="review-status text-[12px] mt-2 text-ink-600">${running ? 'Available when the current mission finishes.' : ''}</div>
      </div>`;
    reviewBody.querySelectorAll('.review-action').forEach(btn => btn.addEventListener('click', () => submitReview(e, btn.dataset.action)));
    setButtons();
    reviewBadge.textContent = items.length;
    reviewBadge.classList.remove('hidden');
    showTab('review');
  }

  async function submitReview(e, action) {
    if (running) return;
    const status = reviewBody.querySelector('.review-status');
    const reviewer = reviewBody.querySelector('.review-name').value.trim();
    const values = {};
    if (action === 'confirm') reviewBody.querySelectorAll('.review-input').forEach(el => { values[el.dataset.field] = el.value.trim(); });
    status.className = 'review-status text-[12px] mt-2 text-ink-400';
    status.textContent = 'Checking the entries…';
    try {
      const j = await api(`/api/runs/${encodeURIComponent(e.run_id)}/review`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, reviewer, values }),
      });
      reviewBody.querySelectorAll('.review-action, .review-field').forEach(el => { el.disabled = true; el.classList.add('used'); });
      const pill = reviewBody.querySelector('.pill');
      if (pill) { pill.textContent = action === 'confirm' ? 'resumed' : 'sent for re-measurement'; pill.className = `pill ${action === 'confirm' ? 'ok' : 'warn'}`; }
      status.className = 'review-status text-[12px] mt-2 text-signal-ok';
      status.textContent = action === 'confirm'
        ? `Accepted. The run resumes from this step, each value recorded as entered by ${reviewer}.`
        : `Sent for re-measurement by ${reviewer}. The run ends here, with the reason logged.`;
      reviewBadge.classList.add('hidden');
      appendUserMessage(action === 'confirm'
        ? `${reviewer}: from the original report, ${Object.entries(values).map(([k, v]) => `${k} = ${v}`).join(', ')}. Resume the run.`
        : `${reviewer}: send it for re-measurement.`, []);
      startJob(Promise.resolve(j), true);
    } catch (err) {
      status.className = 'review-status text-[12px] mt-2 text-signal-warn';
      status.textContent = err.message;
    }
  }

  function renderRouter(tasks) {
    routerBody.innerHTML = `<div class="text-[11.5px] text-ink-600 mb-2 leading-relaxed">The Router picks a model per task from measured qualification results. Untested is not qualified; a model that ever wrote a false approval is shut out.</div>` +
      Object.entries(tasks).map(([task, d]) => {
        const chosen = d.candidates.find(c => c.model === d.chosen);
        return `
        <div class="card card-shadow mb-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12.5px] text-ink-100 font-medium font-mono">${esc(task)}</span>
            <span class="pill ${d.chosen ? 'ok' : 'warn'}">${esc(d.chosen || 'no model')}</span>
          </div>
          <div class="text-[11.5px] text-ink-600 mt-1">${esc(d.description)}</div>
          <div class="text-[12px] text-ink-300 mt-2">${esc(d.reason)}</div>
          <div class="mt-2 space-y-1">${d.candidates.map(c => `
            <div class="flex gap-2 text-[11px] font-mono">
              <span class="${c.eligible ? 'text-signal-ok' : 'text-ink-700'}">${c.eligible ? '+' : '−'}</span>
              <span class="text-ink-300 shrink-0" style="width:10.5rem">${esc(c.model)}</span>
              <span class="text-ink-600">${esc(c.reason)}</span>
            </div>`).join('')}</div>
          ${chosen && chosen.evidence && chosen.evidence.length ? `<div class="text-[11px] text-ink-700 mt-2" style="word-break:break-all">evidence: ${esc(chosen.evidence.join(', '))}</div>` : ''}
        </div>`;
      }).join('');
  }

  function renderLibrary(e) {
    addCard(`
      <div class="flex items-center justify-between mb-2">
        <span class="text-[12.5px] text-ink-100 font-medium">Reference library</span>
        <span class="pill info">${e.hits.length} passages</span>
      </div>
      <div class="text-[12px] text-ink-300 mb-2">“${esc(e.question)}”</div>
      ${e.hits.map(h => `
        <div class="border-t border-base-800 pt-2 mt-2">
          <div class="text-[11.5px] font-mono text-indigo-200">${esc(h.citation)}</div>
          <div class="text-[11.5px] text-ink-500">${esc(h.title)}${h.heading ? ' · ' + esc(h.heading) : ''}</div>
          <div class="text-[12px] text-ink-300 mt-1">${esc(h.text.length > 420 ? h.text.slice(0, 420) + '…' : h.text)}</div>
          <div class="text-[10.5px] text-ink-700 mt-1 font-mono">${h.why.referenced_by ? 'pulled in: referenced by ' + esc(h.why.referenced_by)
            : esc(Object.entries(h.why).map(([k, v]) => `${k} ${Array.isArray(v) ? v.join('/') : v}`).join(' · '))}</div>
        </div>`).join('')}`);
  }

  function renderCode(e) {
    addCard(`
      <div class="flex items-center justify-between mb-2">
        <span class="text-[12.5px] text-ink-100 font-medium">Coder · ${esc(e.task_id)}</span>
        <span class="pill ${e.accepted ? 'ok' : 'bad'}">${e.accepted ? 'accepted' : 'not accepted'}</span>
      </div>
      ${kv('Model', e.model)}
      ${kv('Attempts', e.attempts)}
      ${kv('Isolation', e.isolation)}
      <div class="text-[11px] text-ink-600 mt-2">Accepted only because our held-out acceptance tests passed — the model never saw them.</div>
      ${e.code ? `<pre class="code-block">${esc(e.code)}</pre>` : ''}`);
  }

  // ---------- Chat ----------
  const runBtn = document.getElementById('runBtn');
  const promptInput = document.getElementById('promptInput');
  const elapsedEl = document.getElementById('elapsed');
  const chatThread = document.getElementById('chatThread');
  const chatScroll = document.getElementById('chatScroll');
  const emptyState = document.getElementById('emptyState');
  const greetingText = document.getElementById('greetingText');
  let running = false;
  let timer = null;
  let lastEvidence = {};
  let scenario = null;

  function setGreeting() {
    const h = new Date().getHours();
    greetingText.textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  }

  function updateEmptyState() {
    emptyState.classList.toggle('hidden', chatThread.children.length > 0);
  }

  setGreeting();
  updateEmptyState();

  // ---------- Chat history (persisted) ----------
  const CHATS_KEY = 'workbench_chats';
  let chats = [];
  try { chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]'); } catch (e) { chats = []; }
  let currentChatId = null;
  const historyList = document.getElementById('historyList');

  function saveChats() { try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch (e) { /* storage unavailable */ } }

  // What each request in a chat was planned as. The service keeps no chat state: the most recent
  // turns go with the next request, so the Planner can tell what "it" or "the same" refers to.
  let historyLimit = 0;   // how many the service accepts (/api/health); none until it has said
  function rememberTurn(e) {
    const chat = chats.find(c => c.id === currentChatId);
    if (!chat) return;
    chat.turns = [...(chat.turns || []), { request: e.request, plan: e.steps.map(s => s.title), not_possible: e.not_possible || '' }];
    saveChats();
  }
  function recentTurns() {
    const chat = chats.find(c => c.id === currentChatId);
    return historyLimit ? ((chat && chat.turns) || []).slice(-historyLimit) : [];
  }

  // What the workbench can be asked for: sent by the service with a plan that runs nothing (its catalogue, no model).
  function renderHelp(h) {
    return `<div class="mt-2 text-ink-100">${esc(h.intro)}</div>
      ${h.kinds.map(k => `<div class="mt-1"><span class="text-indigo-300 font-mono">${esc(k.kind)}</span> <span class="text-ink-600">— ${esc(k.description)}</span></div>`).join('')}
      <div class="mt-2 text-[11.5px] text-ink-600">Reports: ${esc(h.reports.join(', '))}</div>
      <div class="mt-1 text-[11.5px] text-ink-600">Coding tasks: ${esc(h.tasks.map(t => `${t.task_id} (${t.purpose})`).join('; '))}</div>
      <div class="mt-1 text-[11.5px] text-ink-600">Library: ${esc(h.library.map(d => `${d.doc_id} ${d.title}`).join('; '))}</div>`;
  }

  function renderHistory() {
    historyList.innerHTML = chats.slice().reverse().map(c => `
      <button data-id="${esc(c.id)}" class="history-item block w-full text-left px-2.5 py-2 rounded-md text-[12.5px] truncate transition-colors ${c.id === currentChatId ? 'bg-indigo-400/10 text-indigo-200' : 'text-ink-500 hover:bg-base-900 hover:text-ink-300'}">${esc(c.title)}</button>
    `).join('') || `<div class="text-[11px] text-ink-700 px-2.5 py-2">No past chats yet</div>`;
    historyList.querySelectorAll('.history-item').forEach(btn => {
      btn.addEventListener('click', () => openChat(btn.dataset.id));
    });
  }

  function openChat(id) {
    const chat = chats.find(c => c.id === id);
    if (!chat || running) return;
    stopTimer();
    currentChatId = id;
    chatThread.innerHTML = '';
    chat.messages.forEach(m => {
      if (m.role === 'user') appendUserMessage(m.text, (m.files || []).map(name => ({ name })), false);
      else appendReply(m.html, false);
    });
    resetEvidence();
    resetActivity();
    updateEmptyState();
    renderHistory();
  }

  renderHistory();

  function appendUserMessage(text, files, persist = true) {
    const div = document.createElement('div');
    div.className = 'msg-in';
    const fileChips = files.map(f => `
      <div class="mt-2 inline-flex items-center gap-1.5 text-[11px] text-indigo-200 border border-indigo-400/25 bg-indigo-400/[0.06] rounded-md px-2 py-1 mr-1.5">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${fileIconPath(f.name)}</svg>
        ${esc(f.name)}
      </div>`).join('');
    const shown = text || 'Analyse the attached file.';
    div.innerHTML = `
      <div class="text-ink-500 text-[11px] mb-1">You</div>
      <div class="bg-base-900 border border-base-800 rounded-lg rounded-tl-sm px-3 py-2 text-ink-100 card-shadow">${esc(shown)}</div>
      ${fileChips}`;
    chatThread.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    updateEmptyState();

    if (persist) {
      if (!currentChatId) {
        currentChatId = String(Date.now());
        chats.push({ id: currentChatId, title: shown.slice(0, 34), messages: [] });
      }
      chats.find(c => c.id === currentChatId).messages.push({ role: 'user', text: shown, files: files.map(f => f.name) });
      saveChats();
      renderHistory();
    }
  }

  // `html` is built by this page from escaped values.
  function appendReply(html, persist = true) {
    const div = document.createElement('div');
    div.className = 'msg-in';
    div.innerHTML = `
      <div class="text-ink-500 text-[11px] mb-1">Workbench</div>
      <div class="bg-base-850 border border-base-800 rounded-lg rounded-tl-sm px-3 py-2 text-ink-300 card-shadow">${html}</div>`;
    chatThread.appendChild(div);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    updateEmptyState();

    if (persist && currentChatId) {
      chats.find(c => c.id === currentChatId).messages.push({ role: 'assistant', html });
      saveChats();
    }
  }

  // ---------- Running a mission ----------
  function startTimer() {
    const start = Date.now();
    elapsedEl.classList.remove('text-ink-600', 'text-signal-ok');
    elapsedEl.classList.add('text-signal-warn');
    clearInterval(timer);
    timer = setInterval(() => { elapsedEl.textContent = ((Date.now() - start) / 1000).toFixed(1) + 's'; }, 100);
  }

  function stopTimer() {
    clearInterval(timer);
    elapsedEl.classList.remove('text-signal-warn');
    elapsedEl.classList.add('text-signal-ok');
  }

  function finish(message) {
    running = false;
    stopTimer();
    setButtons();
    if (message) appendReply(message);
  }

  function setButtons() {
    ['demoBtnHeader', 'demoBtnEmpty'].forEach(id => { document.getElementById(id).disabled = running || !served; });
    document.querySelectorAll('.review-action:not(.used)').forEach(b => { b.disabled = running || !served; });
    const reviewStatus = document.querySelector('.review-status');
    if (reviewStatus && !running && reviewStatus.textContent === 'Available when the current mission finishes.') reviewStatus.textContent = '';
  }

  // keep: a resumed run continues the same mission, so its timeline and evidence stay on screen.
  async function startJob(request, keep = false) {
    running = true;
    setButtons();
    if (!keep) {
      resetActivity();
      resetEvidence();
      lastEvidence = {};
    }
    startTimer();
    try {
      const j = await request;
      follow(j.job);
    } catch (err) {
      finish(`Could not start: ${esc(err.message)}`);
    }
  }

  function follow(jobId) {
    const source = new EventSource(`/api/jobs/${encodeURIComponent(jobId)}/events`);
    const state = { beat: null, run: null, agentRow: {} };   // agentRow: agent id -> the row its tool calls go under
    source.onmessage = (message) => {
      let e;
      try { e = JSON.parse(message.data); } catch (err) { return; }
      try { handle(e, state); } catch (err) { console.error(err, e); }
      if (e.type === 'stream_end') { source.close(); finish(); }
    };
    source.onerror = () => { source.close(); if (running) finish('The connection to the service was lost.'); };
  }

  function handle(e, state) {
    const b = state.beat === null ? 'x' : state.beat;
    switch (e.type) {
      case 'queued': upsertRow('queue', { agent: 'Workbench', detail: 'queued — missions run one at a time on this machine', status: 'idle' }); break;
      case 'started': activity = activity.filter(a => a.key !== 'queue'); renderActivity(); break;
      case 'notice': appendReply(esc(e.message)); break;
      case 'error': appendReply(`<span class="text-signal-danger">Error:</span> ${esc(e.message)}`); break;

      case 'demo_start':
      case 'mission_start':
        state.replyOnly = e.type === 'mission_start' && e.beats.length > 0 && e.beats.every(s => s.kind === 'reply');
        if (state.replyOnly) break;   // just a reply: no plan to show
        appendReply(`${e.title ? `<div class="text-ink-100 font-medium">${esc(e.title)}</div>` : ''}
          ${e.beats.length ? `<div class="mt-1">Plan, ${e.beats.length} step${e.beats.length === 1 ? '' : 's'}:</div>` : ''}
          ${e.beats.map((s, i) => `<div class="mt-1"><span class="text-indigo-300">${i + 1}.</span> ${esc(s.title)} <span class="text-ink-600">— ${esc(s.agents.join(', '))}${s.planned_by === 'scenario' ? ' · from the demo scenario' : ''}</span></div>`).join('')}
          <div class="text-[11.5px] text-ink-600 mt-2">${esc(e.plan_note)}</div>
          ${!e.beats.length && e.help ? renderHelp(e.help) : ''}`);
        break;
      case 'plan': {
        rememberTurn(e);
        const ok = e.outcome === 'planned' || e.outcome === 'not possible';
        const first = e.attempts[0] || {};
        const replanned = e.attempts.length > 1 ? ` · re-planned after: ${(first.problems || []).join('; ')}` : '';
        upsertRow(`${b}-agent-planner`, { agent: 'Planner', detail: `${e.model || 'no model'} · ${e.steps.length} step${e.steps.length === 1 ? '' : 's'}${e.regulated_by ? ' · regulated request: the inspection graph is required' : ''}${replanned}`, status: ok ? 'ok' : 'stop', tag: e.outcome, tagClass: ok ? 'info' : 'warn' });
        break;
      }
      case 'router': renderRouter(e.tasks); break;
      case 'beat_start': state.beat = e.index; addGroup(`${e.index + 1} · ${e.title}`, e.caption); break;
      case 'beat_end': break;
      case 'demo_end':
      case 'mission_end': if (e.outcomes.length && !state.replyOnly) appendReply(`Mission finished in ${esc(e.seconds)} s. Every step above was a real run on this machine; the run folders and hash-chained logs hold the same facts.`); break;

      // agents and the tool gate (workbench/tools.py): stage agents already have their rows, so
      // their lifecycle only says where their tool calls go; other agents get a row of their own
      case 'agent': {
        if (e.node) { if (e.phase === 'started') state.agentRow[e.agent_id] = `${b}-${e.run_id}-${e.node}-${e.attempt}`; break; }
        const key = `${b}-agent-${e.agent_id}`;
        state.agentRow[e.agent_id] = key;
        const exists = activity.some(a => a.key === key);
        if (e.phase === 'started') upsertRow(key, exists ? { status: 'active' } : { agent: agentLabel(e.agent_id), detail: 'working…', status: 'active' });
        else if (e.phase === 'completed') upsertRow(key, { status: 'ok' });
        else upsertRow(key, { status: 'fail', detail: e.reason || e.error || 'failed', tag: 'failed', tagClass: 'bad' });
        break;
      }
      case 'tool': {
        const key = state.agentRow[e.agent_id] || `${b}-gate-${e.agent_id}`;
        if (!activity.some(a => a.key === key)) upsertRow(key, { agent: `Tool gate · ${agentLabel(e.agent_id || 'no agent')}`, detail: '', status: e.status === 'ok' ? 'info' : 'fail' });
        const row = activity.find(a => a.key === key);
        upsertRow(key, { tools: [...(row.tools || []), { tool: e.tool, status: e.status, seconds: e.seconds, reason: e.reason || e.error }] });
        break;
      }

      // inspection
      case 'run_start': state.run = e.run_id; upsertRow(`${b}-run-${e.run_id}`, { agent: 'Procedural graph', detail: `${e.graph} · ${e.image && e.image.length ? 'uploaded / given file' : e.source + (e.source === 'scan' ? ' (' + e.scan_quality + ')' : '')}${e.inject_fault ? ' · fault injected on purpose' : ''}`, status: 'info' }); break;
      case 'stage_enter': upsertRow(`${b}-${e.run_id}-${e.node}-${e.attempt}`, { agent: e.agent, detail: `${e.node} · attempt ${e.attempt}…`, status: 'active', tag: '', tagClass: '' }); break;
      case 'stage': {
        const stop = e.next_kind === 'review' || e.next === 'needs_review';
        const sentBack = e.status !== 'ok' && !stop;
        upsertRow(`${b}-${e.run_id}-${e.node}-${e.attempt}`, {
          agent: e.agent, detail: `${e.note} · ${e.seconds}s`,
          status: e.status === 'ok' ? 'ok' : stop ? 'stop' : 'fail',
          tag: stop ? 'stopped for a person' : sentBack ? `sent back → ${e.next}` : (e.attempt > 1 ? `attempt ${e.attempt}` : (/\(code\)/.test(e.agent) ? 'no model' : '')),
          tagClass: stop ? 'warn' : sentBack ? 'bad' : (e.attempt > 1 ? 'ok' : 'info'),
        });
        break;
      }
      case 'evidence': renderEvidence(e, state.run); break;
      case 'review': renderReview(e); break;
      case 'run_resumed':
        state.run = e.run_id;
        addGroup(`Resumed · ${e.doc_id}`, e.action === 'remeasure'
          ? `${e.reviewer} sent it for re-measurement; the run ends with the reason logged.`
          : `${e.reviewer} entered ${Object.entries(e.values || {}).map(([k, v]) => `${k} = ${v}`).join(', ')} from the original report. The run continues from the review step, on the ${e.engine} engine.`);
        break;
      case 'decision': renderDecision(e, state.run); break;
      case 'route': upsertRow(`${b}-route-${e.task}`, { agent: 'Router', detail: `${e.task} → ${e.chosen || 'no qualified model'} · ${e.decision}`, status: e.chosen ? 'ok' : 'stop', tag: e.chosen || 'none', tagClass: e.chosen ? 'info' : 'warn' }); break;
      case 'summary': break;
      case 'run_end': {
        if (e.end === 'paused') {
          appendReply(`<span class="text-signal-warn">Paused for a person.</span> ${esc(e.reason || 'A value could not be read with certainty')}. Nothing was guessed: an engineer enters the value from the original report in <b>Review</b>, and the run resumes from exactly that step.`);
          break;
        }
        const stopped = e.end === 'needs_review';
        appendReply(stopped
          ? `<span class="text-signal-warn">Stopped for a person.</span> ${esc(e.reason || 'A value could not be read with certainty')}. No note was drafted.`
          : `<span class="text-signal-ok">Draft ready.</span> ${esc(e.summary_text || '')}
             ${e.note_url ? `<div class="mt-2"><a class="chat-link" href="${esc(e.note_url)}" download>Download the draft approval note (.docx)</a> <span class="text-ink-600 text-[11.5px]">· summary by ${esc(e.written_by)}</span></div>` : ''}`);
        break;
      }

      // library
      case 'library': {
        renderLibrary(e);
        upsertRow(`${b}-agent-librarian`, { agent: 'Librarian (search)', detail: `${e.hits.length} passages: ${e.hits.map(h => h.citation).join(' | ')}`, status: 'ok', tag: 'cited', tagClass: 'info' });
        const top = e.hits[0];
        appendReply(top
          ? `“${esc(e.question)}” — the library's closest passage: <span class="font-mono text-indigo-200">${esc(top.citation)}</span> — ${esc(top.heading)}. <span class="text-ink-600">All ${e.hits.length} passages are shown in Evidence; the answer is the cited text itself.</span>`
          : 'The library returned nothing for that question.');
        break;
      }

      // chat: a general answer, labelled as not from the organisation's documents
      case 'reply':
        upsertRow(`${b}-agent-chat`, { agent: 'Chat', detail: `${e.model || 'no model'} · ${e.outcome}`, status: e.outcome === 'answered' ? 'ok' : 'stop', tag: e.outcome === 'answered' ? 'general answer' : e.outcome, tagClass: e.outcome === 'answered' ? 'info' : 'warn' });
        appendReply(`${esc(e.text)}${e.label ? `<div class="text-[11px] text-ink-700 mt-1">${esc(e.label)}</div>` : ''}`);
        break;

      // coder
      case 'task': upsertRow(`${b}-agent-coder`, { agent: 'Coder', detail: e.brief.split('\n')[0], status: 'info', tag: `up to ${e.max_attempts} attempts`, tagClass: '' }); break;
      case 'attempt_start': state.agentRow.coder = `${b}-attempt-${e.n}`; upsertRow(`${b}-attempt-${e.n}`, { agent: 'Coder → Sandbox', detail: `attempt ${e.n}: writing the program and running our tests in the sealed sandbox…`, status: 'active' }); break;
      case 'attempt': {
        const last = (e.stderr || e.stdout || '').trim().split('\n').pop();
        upsertRow(`${b}-attempt-${e.n}`, { agent: 'Coder → Sandbox', detail: `attempt ${e.n}: ${e.passed ? 'all acceptance tests passed' : (last || 'failed')} · ${e.seconds}s · ${e.isolation}`, status: e.passed ? 'ok' : 'fail', tag: e.passed ? 'passed' : 'failed — told why, trying again', tagClass: e.passed ? 'ok' : 'bad' });
        break;
      }
      case 'code_result': renderCode(e); appendReply(`${e.accepted ? '<span class="text-signal-ok">Program accepted.</span>' : '<span class="text-signal-danger">Not accepted.</span>'} ${esc(e.summary)} — the code and its test results are in Evidence.`); break;
    }
  }

  // ---------- Buttons ----------
  function runDemo() {
    if (running || !served) return;
    appendUserMessage(scenario ? scenario.request : 'Run the demo mission.', []);
    startJob(api('/api/demo', { method: 'POST' }));
  }
  document.getElementById('demoBtnHeader').addEventListener('click', runDemo);
  document.getElementById('demoBtnEmpty').addEventListener('click', runDemo);

  runBtn.addEventListener('click', () => {
    if (running) return;
    const text = promptInput.value.trim();
    const files = stagedFiles.slice();
    if (!text && !files.length) return;
    appendUserMessage(text, files);
    promptInput.value = '';
    stagedFiles = [];
    renderStaged();
    if (!served) { appendReply(notServedMessage); return; }
    if (!files.length) {   // a request in plain words: the Planner plans it, code checks the plan, the steps run
      startJob(api('/api/missions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request: text, history: recentTurns() }) }));
      return;
    }
    const form = new FormData();
    files.forEach(f => form.append('files', f));
    startJob(api('/api/inspections', { method: 'POST', body: form }));
  });

  function startNewChat() {
    if (running) return;
    stopTimer();
    currentChatId = null;
    chatThread.innerHTML = '';
    stagedFiles = [];
    renderStaged();
    resetEvidence();
    resetActivity();
    elapsedEl.classList.remove('text-signal-warn', 'text-signal-ok');
    elapsedEl.classList.add('text-ink-600');
    elapsedEl.textContent = 'idle';
    setGreeting();
    updateEmptyState();
    renderHistory();
  }

  document.getElementById('newChatBtn').addEventListener('click', startNewChat);
  document.getElementById('sidebarNewChat').addEventListener('click', startNewChat);

  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      runBtn.click();
    }
  });

  // ---------- Start-up ----------
  const notServedMessage = 'This page is not connected to the workbench service. Start it with <span class="font-mono">python -m workbench.server</span> and open the address it prints.';
  resetEvidence();
  setButtons();
  if (!served) {
    document.getElementById('healthLine').innerHTML = notServedMessage;
    document.getElementById('extLabel').textContent = 'service not connected';
  } else {
    api('/api/demo').then(s => { scenario = s; }).catch(() => {});
    api('/api/router').then(r => renderRouter(r.tasks)).catch(() => {});
    api('/api/health').then(h => {
      historyLimit = h.mission_history_entries || 0;
      const missing = [!h.ollama && 'Ollama', !h.docker && 'Docker', h.docker && !h.sandbox_image && 'sandbox image', !h.ocr_environment && 'OCR environment'].filter(Boolean);
      document.getElementById('healthLine').textContent = missing.length
        ? `Not ready: ${missing.join(', ')}`
        : `Ready · models on this machine: ${h.models_available.join(', ')}`;
    }).catch(() => { document.getElementById('healthLine').textContent = 'service not reachable'; });
    pollNetwork();
    setInterval(pollNetwork, 4000);
  }

  // ---------- Resizable panels ----------
  const PANEL_MIN = 260;
  const PANELS_KEY = 'workbench_panel_widths';
  const agentPanel = document.getElementById('agentPanel');
  const evidencePanel = document.getElementById('evidencePanel');

  function saveWidths() {
    localStorage.setItem(PANELS_KEY, JSON.stringify({
      agent: agentPanel.offsetWidth,
      request: requestPanel.offsetWidth,
      evidence: evidencePanel.offsetWidth,
    }));
  }

  function applySavedWidths() {
    if (window.innerWidth < 1024) return;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(PANELS_KEY) || 'null'); } catch (e) { /* ignore */ }
    if (!saved) return;
    agentPanel.style.flex = `1 1 ${saved.agent}px`;
    requestPanel.style.flex = `1 1 ${saved.request}px`;
    evidencePanel.style.flex = `1 1 ${saved.evidence}px`;
  }
  applySavedWidths();

  function resetPanels() {
    [agentPanel, requestPanel, evidencePanel].forEach(p => p.style.flex = '');
    localStorage.removeItem(PANELS_KEY);
  }

  function initResizer(handle, leftPanel, rightPanel) {
    handle.addEventListener('pointerdown', (e) => {
      if (window.innerWidth < 1024) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      handle.classList.add('dragging');
      const startX = e.clientX;
      const startLeft = leftPanel.offsetWidth;
      const startRight = rightPanel.offsetWidth;

      function onMove(ev) {
        const dx = ev.clientX - startX;
        let newLeft = startLeft + dx;
        let newRight = startRight - dx;
        if (newLeft < PANEL_MIN) { newRight -= (PANEL_MIN - newLeft); newLeft = PANEL_MIN; }
        if (newRight < PANEL_MIN) { newLeft -= (PANEL_MIN - newRight); newRight = PANEL_MIN; }
        leftPanel.style.flex = `1 1 ${newLeft}px`;
        rightPanel.style.flex = `1 1 ${newRight}px`;
      }
      function onUp() {
        handle.releasePointerCapture(e.pointerId);
        handle.classList.remove('dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        saveWidths();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
    handle.addEventListener('dblclick', resetPanels);
  }

  initResizer(document.getElementById('handle1'), agentPanel, requestPanel);
  initResizer(document.getElementById('handle2'), requestPanel, evidencePanel);

  // ---------- Collapsible sidebar ----------
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const SIDEBAR_KEY = 'workbench_sidebar_collapsed';

  function setSidebarCollapsed(collapsed) {
    sidebar.classList.toggle('sidebar-collapsed', collapsed);
    localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
  }

  setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === '1');
  sidebarToggle.addEventListener('click', () => {
    setSidebarCollapsed(!sidebar.classList.contains('sidebar-collapsed'));
  });
</script>
</body>
</html>
