<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workbench — Offline Inspection Assistant</title>
<style>
  /* Reset + scrollbars */
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #2b2b34 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2b2b34; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  html, body { height: 100%; margin: 0; }
  body { -webkit-font-smoothing: antialiased; }

  /* Palette (hand-vendored so no CDN/build step is needed — everything below
     runs from this one static file, offline) */
  :root {
    --base-950:#0a0a0d; --base-900:#121216; --base-850:#17171d; --base-800:#1e1e25; --base-700:#2b2b34; --base-600:#3f3f4a;
    --ink-100:#f4f4f6; --ink-200:#dcdce2; --ink-300:#c9c9d2; --ink-500:#8d8d9a; --ink-600:#6c6c78; --ink-700:#525260;
    --signal-ok:#34d399; --signal-warn:#fbbf24; --signal-danger:#fb7185;
    --indigo-200:#c7d2fe; --indigo-300:#a5b4fc; --indigo-400:#818cf8;
    --emerald-300:#6ee7b7; --emerald-400:#34d399;
    --amber-400:#fbbf24;
    --rose-300:#fda4af; --rose-400:#fb7185;
  }

  body {
    background-color: var(--base-950);
    background-image:
      radial-gradient(760px circle at 8% -8%, rgba(129,140,248,0.16), transparent 60%),
      radial-gradient(680px circle at 96% 8%, rgba(251,113,133,0.10), transparent 55%),
      radial-gradient(900px circle at 50% 115%, rgba(52,211,153,0.10), transparent 55%);
    background-attachment: fixed;
    color: var(--ink-100);
  }

  /* ---------- Component / animation classes ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,.4); }
    50% { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
  }

  .stage-active .stage-dot { animation: pulseWarn 1.4s ease-in-out infinite; }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,.45); }
    50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); }
  }

  .fade-swap { animation: fadeSwap .35s cubic-bezier(.16,1,.3,1); }
  @keyframes fadeSwap {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-line { animation: logIn .3s ease-out; }
  @keyframes logIn {
    from { opacity: 0; transform: translateX(-4px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .msg-in { animation: msgIn .35s cubic-bezier(.16,1,.3,1); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chip-in { animation: chipIn .25s cubic-bezier(.34,1.4,.64,1); }
  @keyframes chipIn {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .btn-lift { transition: transform .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .btn-lift:hover { transform: translateY(-1px); }
  .btn-lift:active { transform: translateY(0); }

  .send-btn {
    background: linear-gradient(135deg, #818cf8, #a78bfa);
    box-shadow: 0 2px 14px -2px rgba(129,140,248,.55);
  }
  .send-btn:hover { box-shadow: 0 4px 18px -2px rgba(129,140,248,.7); }

  .card-shadow { box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.5); }

  .drop-overlay { animation: fadeSwap .18s ease-out; }

  /* ---------- Utility layer (hand-written, mirrors the classes used below) ---------- */
  /* Positioning */
  .relative { position: relative; }
  .absolute { position: absolute; }
  .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
  .z-10 { z-index: 10; }

  /* Display */
  .grid { display: grid; }
  .inline-flex { display: inline-flex; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .block { display: block; }
  .hidden { display: none; } /* kept last among display rules so it always wins when toggled against flex/grid/block */

  /* Flex / grid item behavior */
  .flex-1 { flex: 1 1 0%; }
  .shrink-0 { flex-shrink: 0; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .items-end { align-items: flex-end; }
  .justify-center { justify-content: center; }
  .justify-between { justify-content: space-between; }
  .grid-cols-1 { grid-template-columns: repeat(1, minmax(0,1fr)); }
  .grid-cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

  /* Gaps / stacked spacing */
  .gap-1\.5 { gap: .375rem; }
  .gap-2 { gap: .5rem; }
  .gap-3 { gap: .75rem; }
  .gap-4 { gap: 1rem; }
  .gap-px { gap: 1px; }
  .space-y-1 > * + * { margin-top: .25rem; }
  .space-y-2 > * + * { margin-top: .5rem; }
  .space-y-4 > * + * { margin-top: 1rem; }

  /* Margin / padding */
  .m-3 { margin: .75rem; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .mt-0\.5 { margin-top: .125rem; }
  .mt-1 { margin-top: .25rem; }
  .mt-2 { margin-top: .5rem; }
  .mt-4 { margin-top: 1rem; }
  .mb-1 { margin-bottom: .25rem; }
  .mb-2 { margin-bottom: .5rem; }
  .mr-1\.5 { margin-right: .375rem; }
  .my-1 { margin-top: .25rem; margin-bottom: .25rem; }
  .p-3 { padding: .75rem; }
  .px-2 { padding-left: .5rem; padding-right: .5rem; }
  .px-2\.5 { padding-left: .625rem; padding-right: .625rem; }
  .px-3 { padding-left: .75rem; padding-right: .75rem; }
  .px-4 { padding-left: 1rem; padding-right: 1rem; }
  .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
  .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
  .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
  .py-1\.5 { padding-top: .375rem; padding-bottom: .375rem; }
  .py-2 { padding-top: .5rem; padding-bottom: .5rem; }
  .py-2\.5 { padding-top: .625rem; padding-bottom: .625rem; }
  .py-3 { padding-top: .75rem; padding-bottom: .75rem; }
  .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
  .pb-2 { padding-bottom: .5rem; }
  .pb-3 { padding-bottom: .75rem; }
  .pb-6 { padding-bottom: 1.5rem; }
  .pt-2 { padding-top: .5rem; }
  .pl-2 { padding-left: .5rem; }
  .pr-1 { padding-right: .25rem; }

  /* Sizing */
  .w-1\.5 { width: .375rem; }
  .w-2\.5 { width: .625rem; }
  .w-4 { width: 1rem; }
  .w-6 { width: 1.5rem; }
  .w-7 { width: 1.75rem; }
  .w-8 { width: 2rem; }
  .w-56 { width: 14rem; }
  .w-full { width: 100%; }
  .w-px { width: 1px; }
  .h-1\.5 { height: .375rem; }
  .h-2\.5 { height: .625rem; }
  .h-4 { height: 1rem; }
  .h-6 { height: 1.5rem; }
  .h-7 { height: 1.75rem; }
  .h-8 { height: 2rem; }
  .h-screen { height: 100vh; }
  .h-\[2px\] { height: 2px; }
  .min-h-\[260px\] { min-height: 260px; }
  .min-h-\[320px\] { min-height: 320px; }
  .max-w-\[110px\] { max-width: 110px; }
  .max-h-32 { max-height: 8rem; }

  /* Typography */
  .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .font-medium { font-weight: 500; }
  .font-semibold { font-weight: 600; }
  .text-sm { font-size: .875rem; line-height: 1.25rem; }
  .text-\[11px\] { font-size: 11px; }
  .text-\[12px\] { font-size: 12px; }
  .text-\[12\.5px\] { font-size: 12.5px; }
  .text-\[13px\] { font-size: 13px; }
  .text-\[16px\] { font-size: 16px; }
  .tracking-tight { letter-spacing: -0.025em; }
  .tracking-wide { letter-spacing: 0.025em; }
  .uppercase { text-transform: uppercase; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leading-none { line-height: 1; }
  .leading-relaxed { line-height: 1.625; }
  .text-left { text-align: left; }
  .text-center { text-align: center; }

  /* Solid colors */
  .bg-base-700 { background-color: var(--base-700); }
  .bg-base-800 { background-color: var(--base-800); }
  .bg-base-850 { background-color: var(--base-850); }
  .bg-base-900 { background-color: var(--base-900); }
  .bg-amber-400 { background-color: var(--amber-400); }
  .bg-emerald-400 { background-color: var(--emerald-400); }
  .bg-indigo-400 { background-color: var(--indigo-400); }
  .bg-rose-400 { background-color: var(--rose-400); }
  .bg-signal-ok { background-color: var(--signal-ok); }
  .bg-signal-warn { background-color: var(--signal-warn); }
  .bg-transparent { background-color: transparent; }
  .border-base-600 { border-color: var(--base-600); }
  .border-base-700 { border-color: var(--base-700); }
  .border-base-800 { border-color: var(--base-800); }
  .border-indigo-400 { border-color: var(--indigo-400); }
  .text-ink-100 { color: var(--ink-100); }
  .text-ink-200 { color: var(--ink-200); }
  .text-ink-300 { color: var(--ink-300); }
  .text-ink-500 { color: var(--ink-500); }
  .text-ink-600 { color: var(--ink-600); }
  .text-ink-700 { color: var(--ink-700); }
  .text-emerald-300 { color: var(--emerald-300); }
  .text-indigo-200 { color: var(--indigo-200); }
  .text-indigo-300 { color: var(--indigo-300); }
  .text-rose-300 { color: var(--rose-300); }
  .text-signal-ok { color: var(--signal-ok); }
  .text-signal-warn { color: var(--signal-warn); }
  .text-signal-danger { color: var(--signal-danger); }
  .text-white { color: #fff; }

  /* Opacity-variant colors (named literally, same values Tailwind would emit) */
  .bg-emerald-400\/\[0\.06\] { background-color: rgba(52,211,153,.06); }
  .bg-indigo-400\/\[0\.06\] { background-color: rgba(129,140,248,.06); }
  .bg-indigo-400\/\[0\.08\] { background-color: rgba(129,140,248,.08); }
  .bg-indigo-400\/10 { background-color: rgba(129,140,248,.10); }
  .bg-rose-400\/10 { background-color: rgba(251,113,133,.10); }
  .bg-rose-400\/15 { background-color: rgba(251,113,133,.15); }
  .bg-base-950\/85 { background-color: rgba(10,10,13,.85); }
  .bg-signal-ok\/40 { background-color: rgba(52,211,153,.4); }
  .border-emerald-400\/25 { border-color: rgba(52,211,153,.25); }
  .border-indigo-400\/25 { border-color: rgba(129,140,248,.25); }
  .border-rose-400\/30 { border-color: rgba(251,113,133,.30); }
  .text-indigo-400\/60 { color: rgba(129,140,248,.60); }
  .ring-1.ring-inset.ring-rose-400\/40 { box-shadow: inset 0 0 0 1px rgba(251,113,133,.40); }

  /* Borders / radius */
  .border { border-width: 1px; border-style: solid; }
  .border-2 { border-width: 2px; border-style: solid; }
  .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
  .border-t { border-top-width: 1px; border-top-style: solid; }
  .border-r { border-right-width: 1px; border-right-style: solid; }
  .border-dashed { border-style: dashed; }
  .rounded { border-radius: .25rem; }
  .rounded-md { border-radius: .375rem; }
  .rounded-lg { border-radius: .5rem; }
  .rounded-full { border-radius: 9999px; }
  .rounded-none { border-radius: 0; }
  .rounded-tl-sm { border-top-left-radius: .125rem; } /* after rounded-lg on purpose: overrides just that corner */

  /* Effects */
  .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .transition-colors { transition-property: color, background-color, border-color; transition-duration: .15s; transition-timing-function: ease; }
  .transition-transform { transition-property: transform; transition-duration: .15s; transition-timing-function: ease; }
  .outline-none { outline: none; }
  .resize-none { resize: none; }

  /* Pseudo-classes */
  .hover\:bg-base-900:hover { background-color: var(--base-900); }
  .hover\:bg-indigo-400\/10:hover { background-color: rgba(129,140,248,.10); }
  .hover\:bg-indigo-400\/30:hover { background-color: rgba(129,140,248,.30); }
  .hover\:border-indigo-400\/40:hover { border-color: rgba(129,140,248,.40); }
  .hover\:text-indigo-200:hover { color: var(--indigo-200); }
  .hover\:text-indigo-300:hover { color: var(--indigo-300); }
  .hover\:text-ink-300:hover { color: var(--ink-300); }
  .hover\:text-white:hover { color: #fff; }
  .focus-within\:border-indigo-400\/50:focus-within { border-color: rgba(129,140,248,.50); }
  .placeholder\:text-ink-600::placeholder { color: var(--ink-600); }

  /* Responsive (matches Tailwind's default md/lg breakpoints) */
  @media (min-width: 768px) {
    .md\:flex { display: flex; }
  }
  @media (min-width: 1024px) {
    .lg\:grid-cols-10 { grid-template-columns: repeat(10, minmax(0,1fr)); }
    .lg\:col-span-3 { grid-column: span 3 / span 3; }
    .lg\:col-span-4 { grid-column: span 4 / span 4; }
    .lg\:border-b-0 { border-bottom-width: 0; }
    .lg\:border-r { border-right-width: 1px; border-right-style: solid; }
  }
</style>
</head>
<body class="text-ink-100 font-sans antialiased h-screen flex overflow-hidden">

  <aside class="w-56 shrink-0 border-r border-base-800 hidden md:flex flex-col">
    <button id="sidebarNewChat" class="btn-lift m-3 flex items-center gap-2 px-3 py-2 rounded-lg border border-base-700 bg-base-900 text-[12.5px] text-ink-300 hover:border-indigo-400/40 hover:text-indigo-200 transition-colors">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="px-3 pb-2 text-[11px] uppercase tracking-wide text-ink-700">Past chats</div>
    <div id="historyList" class="flex-1 overflow-y-auto px-2 pb-3 space-y-1"></div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
  <header class="flex items-center justify-between px-5 py-3 border-b border-base-800 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, rgba(129,140,248,.18), rgba(167,139,250,.10)); border: 1px solid rgba(129,140,248,.35);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="1.6">
          <rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/>
          <rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
        </svg>
      </div>
      <div>
        <div class="text-sm font-semibold tracking-tight text-ink-100">Workbench</div>
        <div class="text-[11px] text-ink-600 leading-none">Offline Inspection Assistant</div>
      </div>
    </div>

    <div class="flex items-center gap-2 text-[12px] px-3 py-1.5 rounded-full border border-emerald-400/25 bg-emerald-400/[0.06]">
      <span class="w-1.5 h-1.5 rounded-full bg-signal-ok pulse-dot"></span>
      <span class="text-emerald-300">Air-gapped</span>
      <span class="text-ink-600">·</span>
      <span class="text-ink-500">0 external calls</span>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-10 overflow-hidden">

    <!-- AGENT ACTIVITY -->
    <section class="reveal lg:col-span-3 flex flex-col border-b lg:border-b-0 lg:border-r border-base-800 min-h-[320px]">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #fbbf24, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <span class="text-[13px] font-medium text-ink-200 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          Agent Activity
        </span>
        <span id="elapsed" class="text-[11px] text-ink-600 font-mono">idle</span>
      </div>

      <div id="stageList" class="flex-1 overflow-y-auto px-4 py-4">
        <!-- stages injected by JS -->
      </div>
    </section>

    <!-- PROMPT / CONVERSATION -->
    <section id="requestPanel" class="relative reveal lg:col-span-4 flex flex-col border-b lg:border-b-0 lg:border-r border-base-800 min-h-[260px]">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #818cf8, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <span class="text-[13px] font-medium text-ink-200 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
          Request
        </span>
        <button id="newChatBtn" title="New chat" class="w-6 h-6 rounded-md flex items-center justify-center text-ink-500 hover:text-indigo-300 hover:bg-indigo-400/10 transition-colors">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto relative">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
          <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#c7d2fe"/>
                <stop offset="100%" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="40" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="205 46" stroke-dashoffset="15" transform="rotate(-90 50 50)"/>
            <circle cx="50" cy="50" r="13" fill="url(#brandGrad)"/>
          </svg>
          <div id="greetingText" class="text-[16px] font-medium text-ink-100 mt-4"></div>
          <div class="text-[12px] text-ink-600 mt-1">What should we look into today?</div>
        </div>
        <div id="chatThread" class="px-4 py-4 space-y-4 text-[13px] leading-relaxed"></div>
      </div>

      <div id="stagedRow" class="hidden px-3 pt-2 flex flex-wrap gap-1.5 shrink-0"></div>

      <div class="p-3 border-t border-base-800 shrink-0">
        <div class="flex items-end gap-2 bg-base-900 border border-base-700 rounded-lg px-2 py-2 focus-within:border-indigo-400/50 transition-colors">
          <input id="fileInput" type="file" multiple class="hidden" />
          <button id="attachBtn" class="shrink-0 w-7 h-7 rounded-md flex items-center justify-center text-ink-500 hover:text-indigo-300 hover:bg-indigo-400/10 transition-colors">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="promptInput" rows="1" placeholder="Describe the task, or drop a file…" class="flex-1 bg-transparent resize-none outline-none text-[13px] text-ink-100 placeholder:text-ink-600 py-1"></textarea>
          <button id="runBtn" class="btn-lift send-btn shrink-0 w-7 h-7 rounded-md text-white flex items-center justify-center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div id="dropOverlay" class="hidden absolute inset-0 z-10 items-center justify-center border-2 border-dashed border-indigo-400 rounded-none bg-base-950/85 backdrop-blur-sm drop-overlay">
        <div class="text-center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.5" class="mx-auto mb-2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <div class="text-[13px] text-indigo-200">Drop to attach</div>
        </div>
      </div>
    </section>

    <!-- EVIDENCE VIEWER -->
    <section class="reveal lg:col-span-3 flex flex-col min-h-[320px]">
      <div class="h-[2px] w-full shrink-0" style="background: linear-gradient(90deg, #fb7185, transparent);"></div>
      <div class="px-4 py-3 border-b border-base-800 flex items-center justify-between shrink-0">
        <span class="text-[13px] font-medium text-ink-200 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
          Evidence
        </span>
        <span id="evidenceStatus" class="text-[11px] text-ink-600 font-mono">—</span>
      </div>

      <div id="evidenceBody" class="flex-1 overflow-y-auto px-4 py-4 text-[13px]">
        <div class="text-ink-600 text-[12px] leading-relaxed">
          Evidence will appear here once a reading is extracted — every value shown is linked back to its exact source cell.
        </div>
      </div>
    </section>
  </main>

  <!-- NETWORK MONITOR -->
  <footer class="border-t border-base-800 shrink-0">
    <button id="netToggle" class="w-full flex items-center justify-between px-5 py-2 text-[12px] hover:bg-base-900 transition-colors">
      <div class="flex items-center gap-4 font-mono">
        <span class="flex items-center gap-1.5 text-ink-300">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          Network
        </span>
        <span class="text-ink-600">external calls <span class="text-signal-ok">0</span></span>
        <span class="text-ink-600">local calls <span id="localCount" class="text-ink-300">0</span></span>
        <span class="text-ink-600">blocked <span id="blockedCount" class="text-ink-300">0</span></span>
      </div>
      <svg id="netChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-ink-500 transition-transform">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>
    <div id="netLog" class="hidden border-t border-base-800 bg-base-900 max-h-32 overflow-y-auto px-5 py-2 font-mono text-[11px] space-y-1"></div>
  </footer>
  </div>

<script>
  document.querySelectorAll('.reveal').forEach((el, i) => {
    setTimeout(() => el.classList.add('in'), 80 + i * 90);
  });

  // ---------- File upload ----------
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const stagedRow = document.getElementById('stagedRow');
  const requestPanel = document.getElementById('requestPanel');
  const dropOverlay = document.getElementById('dropOverlay');
  let stagedFiles = [];

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function fileIconPath(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['png','jpg','jpeg','gif','webp'].includes(ext)) {
      return '<circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/><rect x="3" y="3" width="18" height="18" rx="2"/>';
    }
    return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>';
  }

  function renderStaged() {
    if (stagedFiles.length === 0) {
      stagedRow.classList.add('hidden');
      stagedRow.innerHTML = '';
      return;
    }
    stagedRow.classList.remove('hidden');
    stagedRow.innerHTML = stagedFiles.map((f, i) => `
      <div class="chip-in inline-flex items-center gap-1.5 text-[11px] text-indigo-200 border border-indigo-400/25 bg-indigo-400/[0.08] rounded-md pl-2 pr-1 py-1">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${fileIconPath(f.name)}</svg>
        <span class="max-w-[110px] truncate">${f.name}</span>
        <span class="text-indigo-400/60">${formatBytes(f.size)}</span>
        <button data-i="${i}" class="removeChip w-4 h-4 rounded flex items-center justify-center text-indigo-300/70 hover:text-white hover:bg-indigo-400/30">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>`).join('');
    stagedRow.querySelectorAll('.removeChip').forEach(btn => {
      btn.addEventListener('click', () => {
        stagedFiles.splice(Number(btn.dataset.i), 1);
        renderStaged();
      });
    });
  }

  function addFiles(fileListLike) {
    Array.from(fileListLike).forEach(f => stagedFiles.push(f));
    renderStaged();
  }

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });

  let dragDepth = 0;
  requestPanel.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.remove('hidden');
    dropOverlay.classList.add('flex');
  });
  requestPanel.addEventListener('dragover', (e) => e.preventDefault());
  requestPanel.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) { dropOverlay.classList.add('hidden'); dropOverlay.classList.remove('flex'); }
  });
  requestPanel.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.add('hidden');
    dropOverlay.classList.remove('flex');
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- Agent stages ----------
  const stages = [
    { name: 'Document Reader',     detail: 'OCR scan → text and tables (PaddleOCR-VL)' },
    { name: 'Evidence Builder',    detail: 'Table rows → checked evidence records' },
    { name: 'Rules Engine',        detail: 'Deterministic check — code, no model' },
    { name: 'Standards Researcher',detail: 'Governing clause lookup' },
    { name: 'Report Writer',       detail: 'Drafting approval note (.docx)' },
    { name: 'QA Checker',          detail: 'Structure, semantics, presentation checks' },
  ];

  const stageList = document.getElementById('stageList');

  function renderStages(activeIndex, doneUpTo) {
    stageList.innerHTML = stages.map((s, i) => {
      const isDone = i < doneUpTo;
      const isActive = i === activeIndex;
      const isLast = i === stages.length - 1;
      let dotClass = 'bg-base-700 border border-base-600';
      let textClass = 'text-ink-600';
      if (isDone) { dotClass = 'bg-signal-ok'; textClass = 'text-ink-300'; }
      if (isActive) { dotClass = 'bg-signal-warn stage-dot'; textClass = 'text-ink-100'; }

      return `
        <div class="flex gap-3 ${isActive ? 'stage-active' : ''}">
          <div class="flex flex-col items-center">
            <div class="w-2.5 h-2.5 rounded-full ${dotClass} mt-1 shrink-0"></div>
            ${!isLast ? `<div class="w-px flex-1 ${isDone ? 'bg-signal-ok/40' : 'bg-base-800'} my-1"></div>` : ''}
          </div>
          <div class="pb-6">
            <div class="text-[13px] font-medium ${textClass}">${s.name}</div>
            <div class="text-[12px] text-ink-600 mt-0.5">${s.detail}</div>
          </div>
        </div>`;
    }).join('');
  }

  renderStages(-1, 0);

  // ---------- Network log ----------
  const netLog = document.getElementById('netLog');
  const localCountEl = document.getElementById('localCount');
  const blockedCountEl = document.getElementById('blockedCount');
  let localCount = 0, blockedCount = 0;

  function logNet(text, kind) {
    const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const color = kind === 'blocked' ? 'text-signal-danger' : 'text-signal-ok';
    const tag = kind === 'blocked' ? 'BLOCKED' : 'LOCAL';
    const line = document.createElement('div');
    line.className = 'log-line flex gap-2';
    line.innerHTML = `<span class="text-ink-700">${t}</span><span class="${color}">${tag}</span><span class="text-ink-500">${text}</span>`;
    netLog.appendChild(line);
    netLog.scrollTop = netLog.scrollHeight;
    if (kind === 'blocked') { blockedCount++; blockedCountEl.textContent = blockedCount; }
    else { localCount++; localCountEl.textContent = localCount; }
  }

  document.getElementById('netToggle').addEventListener('click', () => {
    netLog.classList.toggle('hidden');
    document.getElementById('netChevron').style.transform =
      netLog.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
  });

  // ---------- Evidence ----------
  const evidenceBody = document.getElementById('evidenceBody');
  const evidenceStatus = document.getElementById('evidenceStatus');

  function showEvidence() {
    evidenceStatus.textContent = 'CML-014';
    evidenceStatus.className = 'text-[11px] font-mono text-signal-danger';
    evidenceBody.innerHTML = `
      <div class="fade-swap space-y-4">
        <div class="border border-base-800 rounded-lg bg-base-900 p-3 card-shadow">
          <div class="text-[11px] text-ink-600 mb-2 font-mono">Table 3 · Row 7 · Column "Reading (mm)"</div>
          <div class="grid grid-cols-4 gap-px bg-base-800 rounded overflow-hidden text-[11px] font-mono">
            <div class="bg-base-850 px-2 py-1.5 text-ink-500">CML</div>
            <div class="bg-base-850 px-2 py-1.5 text-ink-500">Prev.</div>
            <div class="bg-base-850 px-2 py-1.5 text-ink-500">Reading</div>
            <div class="bg-base-850 px-2 py-1.5 text-ink-500">Min.</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">012</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">5.1</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">5.0</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">4.5</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">014</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">4.9</div>
            <div class="bg-rose-400/15 px-2 py-1.5 text-rose-300 font-semibold ring-1 ring-inset ring-rose-400/40">4.2</div>
            <div class="bg-base-900 px-2 py-1.5 text-ink-300">4.5</div>
          </div>
        </div>

        <div class="space-y-2 text-[12px]">
          <div class="flex justify-between"><span class="text-ink-600">Document</span><span class="text-ink-300 font-mono">inspection_204B.pdf, p. 4</span></div>
          <div class="flex justify-between"><span class="text-ink-600">Equipment</span><span class="text-ink-300 font-mono">CML-014 · Line 204-B</span></div>
          <div class="flex justify-between"><span class="text-ink-600">Parsed value</span><span class="text-ink-100 font-mono">4.2 mm</span></div>
          <div class="flex justify-between"><span class="text-ink-600">Applicable minimum</span><span class="text-ink-100 font-mono">4.5 mm</span></div>
          <div class="flex justify-between"><span class="text-ink-600">Source of minimum</span><span class="text-ink-300 font-mono">OISD-STD-116 §7.3</span></div>
        </div>

        <div class="border border-rose-400/30 bg-rose-400/10 rounded-lg px-3 py-2.5 flex items-start gap-2 card-shadow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-rose-300 mt-0.5 shrink-0"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
          <div class="text-[12px] text-ink-200"><span class="font-medium text-rose-300">Escalate</span> — reading below minimum thickness. Sent for engineer review.</div>
        </div>
      </div>`;
  }

  function resetEvidence() {
    evidenceStatus.textContent = '—';
    evidenceStatus.className = 'text-[11px] text-ink-600 font-mono';
    evidenceBody.innerHTML = `<div class="text-ink-600 text-[12px] leading-relaxed">Evidence will appear here once a reading is extracted — every value shown is linked back to its exact source cell.</div>`;
  }

  // ---------- Run ----------
  const runBtn = document.getElementById('runBtn');
  const promptInput = document.getElementById('promptInput');
  const elapsedEl = document.getElementById('elapsed');
  const chatThread = document.getElementById('chatThread');
  const emptyState = document.getElementById('emptyState');
  const greetingText = document.getElementById('greetingText');
  let running = false;
  let timer = null;

  function setGreeting() {
    const h = new Date().getHours();
    greetingText.textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  }

  function updateEmptyState() {
    emptyState.classList.toggle('hidden', chatThread.children.length > 0);
  }

  setGreeting();
  updateEmptyState();

  // ---------- Chat history (persisted) ----------
  const CHATS_KEY = 'workbench_chats';
  let chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
  let currentChatId = null;
  const historyList = document.getElementById('historyList');

  function saveChats() { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); }

  function renderHistory() {
    historyList.innerHTML = chats.slice().reverse().map(c => `
      <button data-id="${c.id}" class="history-item block w-full text-left px-2.5 py-2 rounded-md text-[12.5px] truncate transition-colors ${c.id === currentChatId ? 'bg-indigo-400/10 text-indigo-200' : 'text-ink-500 hover:bg-base-900 hover:text-ink-300'}">${c.title}</button>
    `).join('') || `<div class="text-[11px] text-ink-700 px-2.5 py-2">No past chats yet</div>`;
    historyList.querySelectorAll('.history-item').forEach(btn => {
      btn.addEventListener('click', () => openChat(btn.dataset.id));
    });
  }

  function openChat(id) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    clearInterval(timer);
    running = false;
    currentChatId = id;
    chatThread.innerHTML = '';
    chat.messages.forEach(m => {
      if (m.role === 'user') appendUserMessage(m.text, (m.files || []).map(name => ({ name })), false);
      else appendReply(m.text, false);
    });
    resetEvidence();
    renderStages(-1, 0);
    updateEmptyState();
    renderHistory();
  }

  renderHistory();

  function appendUserMessage(text, files, persist = true) {
    const div = document.createElement('div');
    div.className = 'msg-in';
    const fileChips = files.map(f => `
      <div class="mt-2 inline-flex items-center gap-1.5 text-[11px] text-indigo-200 border border-indigo-400/25 bg-indigo-400/[0.06] rounded-md px-2 py-1 mr-1.5">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${fileIconPath(f.name)}</svg>
        ${f.name}
      </div>`).join('');
    const shown = text || 'Analyse the attached file.';
    div.innerHTML = `
      <div class="text-ink-500 text-[11px] mb-1">You</div>
      <div class="bg-base-900 border border-base-800 rounded-lg rounded-tl-sm px-3 py-2 text-ink-100 card-shadow">${shown}</div>
      ${fileChips}`;
    chatThread.appendChild(div);
    chatThread.scrollTop = chatThread.scrollHeight;
    updateEmptyState();

    if (persist) {
      if (!currentChatId) {
        currentChatId = String(Date.now());
        chats.push({ id: currentChatId, title: shown.slice(0, 34), messages: [] });
      }
      chats.find(c => c.id === currentChatId).messages.push({ role: 'user', text: shown, files: files.map(f => f.name) });
      saveChats();
      renderHistory();
    }
  }

  function appendReply(text, persist = true) {
    const div = document.createElement('div');
    div.className = 'msg-in';
    div.innerHTML = `
      <div class="text-ink-500 text-[11px] mb-1">Workbench</div>
      <div class="bg-base-850 border border-base-800 rounded-lg rounded-tl-sm px-3 py-2 text-ink-300 card-shadow">${text}</div>`;
    chatThread.appendChild(div);
    chatThread.scrollTop = chatThread.scrollHeight;

    if (persist && currentChatId) {
      chats.find(c => c.id === currentChatId).messages.push({ role: 'assistant', text });
      saveChats();
    }
  }

  runBtn.addEventListener('click', () => {
    if (running) return;
    running = true;

    const text = promptInput.value.trim();
    appendUserMessage(text, stagedFiles);
    promptInput.value = '';
    stagedFiles = [];
    renderStaged();

    resetEvidence();
    renderStages(-1, 0);
    netLog.innerHTML = '';
    localCount = 0; blockedCount = 0;
    localCountEl.textContent = '0'; blockedCountEl.textContent = '0';

    let start = Date.now();
    elapsedEl.classList.remove('text-ink-600', 'text-signal-ok');
    elapsedEl.classList.add('text-signal-warn');
    timer = setInterval(() => {
      elapsedEl.textContent = ((Date.now() - start) / 1000).toFixed(1) + 's';
    }, 100);

    const script = [
      () => { renderStages(0, 0); logNet('llama.cpp :8080 — vision model warm start', 'local'); },
      () => { logNet('PaddleOCR-VL :8090 — page 4 extracted', 'local'); },
      () => { renderStages(1, 1); logNet('evidence-builder — 12 rows checked', 'local'); },
      () => { renderStages(2, 2); logNet('rules-engine — deterministic check, no model', 'local'); },
      () => { logNet('canary — outbound DNS attempt', 'blocked'); },
      () => { renderStages(3, 3); logNet('library-lookup :9002 — OISD-STD-116 §7.3', 'local'); },
      () => { renderStages(4, 4); logNet('docgen :9003 — approval_note_204B.docx', 'local'); },
      () => { renderStages(5, 5); showEvidence(); },
      () => {
        renderStages(6, 6);
        clearInterval(timer);
        elapsedEl.classList.remove('text-signal-warn');
        elapsedEl.classList.add('text-signal-ok');
        appendReply('Draft ready — one reading (CML-014) is below minimum and has been sent for review. Every value in the draft links to its source.');
        running = false;
      },
    ];

    script.forEach((fn, i) => setTimeout(fn, 500 + i * 850));
  });

  function startNewChat() {
    clearInterval(timer);
    running = false;
    currentChatId = null;
    chatThread.innerHTML = '';
    stagedFiles = [];
    renderStaged();
    resetEvidence();
    renderStages(-1, 0);
    netLog.innerHTML = '';
    localCount = 0; blockedCount = 0;
    localCountEl.textContent = '0'; blockedCountEl.textContent = '0';
    elapsedEl.classList.remove('text-signal-warn', 'text-signal-ok');
    elapsedEl.classList.add('text-ink-600');
    elapsedEl.textContent = 'idle';
    setGreeting();
    updateEmptyState();
    renderHistory();
  }

  document.getElementById('newChatBtn').addEventListener('click', startNewChat);
  document.getElementById('sidebarNewChat').addEventListener('click', startNewChat);

  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      runBtn.click();
    }
  });
</script>
</body>
</html>
