# Requests for the Planner's qualification test (bench/stage3/planner_score.py).
#
# expect: the steps a correct plan contains, each [kind, id] -- id is the doc_id or
#   task_id; a library step is [library], its question not compared. Order is not
#   compared.
# alternatives: other step lists that are also correct, where a request can rightly be
#   done more than one way. The plan is judged against `expect` unless it matches one.
# not_possible: whether a correct plan says something in the request cannot be done.
#
# set: `dev` requests may be read while writing the Planner's instructions.
#   `held-out` requests were written on 2026-09-14, before any model planned any
#   request here, and are never used to tune. A change made after reading a
#   held-out result must be recorded in results/stage3/NOTES.md as one.
#
# history (follow-up sets): the chat's earlier turns, as the interface sends them --
#   [{request, plan: [step titles], not_possible}]. Follow-up requests and requests that
#   are not tasks were added on 2026-09-14, after the first qualification run of the
#   D and H requests had started and before any model planned any of them.
#   The same day, at the user's request, the workbench gained a `reply` step for
#   greetings and general questions: F06, G06, G07 and G08 were changed from "not
#   possible" to a reply, and D16, G09 and G10 added -- all before any model planned them.
#
# Equipment tags come from data/corpus/index.json. V-9001 and R-9999 are not in it.

requests:
  # --- dev ---------------------------------------------------------------------
